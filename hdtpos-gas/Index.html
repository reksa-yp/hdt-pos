function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let base = img; try { base = trimCanvas(img) || img; } catch (e) { base = img; }   // buang ruang kosong di sekeliling logo
      const bw = base.naturalWidth || base.width, bh = base.naturalHeight || base.height;
      let scale = Math.min(1, 800 / bw, 320 / bh), out = '';
      const png = file.type !== 'image/jpeg' || !!base._alpha;
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bw * scale)); c.height = Math.max(1, Math.round(bh * scale));
        const g = c.getContext('2d'); if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(base, 0, 0, c.width, c.height); out = c.toDataURL(png ? 'image/png' : 'image/jpeg', .9);
        if (out.length <= 200000) { return resolve(out); } scale *= .8;
      }
      reject(new Error('Gambar terlalu kompleks. Gunakan logo yang lebih sederhana.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}

  for(let i=0;i<value.length;i++){
    const n=value.charCodeAt(i);
    bits += (n.toString(2).padStart(8,'0'))+'0';
  }
  bits += '10101';
  let x=0, bars='';
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1') bars += '<rect x="'+x+'" y="0" width="1" height="38" fill="#000"/>';
    x++;
  }
  return '<svg class="sr-barcode" viewBox="0 0 '+x+' 38" preserveAspectRatio="none" role="img" aria-label="Barcode '+esc(value)+'">'+bars+'</svg><div class="sr-barcode-text">'+esc(value)+'</div>';
}
function serviceReceiptMarkup(x,width){
  const s=ST();
  const row=(l,r,cls)=>'<div class="r-row'+(cls?' '+cls:'')+'"><span>'+esc(l)+'</span><span>'+esc(r||'-')+'</span></div>';
  let h='<div class="receipt '+(width===58?'w58':'w80')+'">'+
    (s.show_logo_on_receipt&&LOGO()?'<img class="r-logo" src="'+esc(LOGO())+'" alt="">':'')+
    '<div class="r-center r-store">'+esc(s.store_name||'Hardware Technology')+'</div>'+
    (s.store_address?'<div class="r-center pre">'+esc(s.store_address)+'</div>':'')+
    (s.store_phone?'<div class="r-center">Telp. '+esc(s.store_phone)+'</div>':'')+
    '<hr class="r-sep"><div class="r-center" style="font-weight:700">STRUK SERVICE</div><hr class="r-sep">'+
    row('No',x.service_no)+row('Tanggal',dmyhm(x.date_in))+row('Pelanggan',x.customer_name)+row('No. HP',x.phone)+
    '<hr class="r-sep">'+
    '<div class="r-item"><div class="r-name">'+esc(x.item_name)+(x.item_color?' · '+esc(x.item_color):'')+'</div></div>'+
    (x.completeness?row('Kelengkapan',x.completeness):'')+
    '<div class="r-item"><div class="r-name">Masalah</div><div class="pre">'+esc(x.problem||'-')+'</div></div>'+
    '<hr class="r-sep">'+row('Status',serviceStatusLabel(x.status))+(x.note?row('Catatan',x.note):'')+
    '<hr class="r-sep solid"><div class="r-center" style="font-weight:700">HARAP BAWA KEMBALI<br>INVOICE SERVICE INI<br>SAAT PENGAMBILAN BARANG</div>'+
    '<hr class="r-sep">'+serviceBarcodeMarkup(x.service_no)+
    '<hr class="r-sep"><div class="r-center">'+esc(s.receipt_footer||'Terima kasih telah menggunakan layanan service kami.')+'</div>'+
    '</div>';
  return h;
}
function openServicePreview(x){
  let paper=S.paper===58?58:80;
  const m=openModal({title:'Preview Struk Service',size:'xl',body:'<div class="service-preview"><div class="service-preview-paper" id="svcPreviewPaper"></div><div><div class="field"><span class="field-label">Ukuran kertas</span><div class="service-paper-options"><label class="service-paper-option"><input type="radio" name="svcPaper" value="58" '+(paper===58?'checked':'')+'> <span><b>58mm</b><small>Struk lebih kecil dan hemat kertas.</small></span></label><label class="service-paper-option"><input type="radio" name="svcPaper" value="80" '+(paper===80?'checked':'')+'> <span><b>80mm</b><small>Lebih lebar untuk detail service.</small></span></label></div></div><div class="service-note">ⓘ Preview ditampilkan terlebih dahulu, sama seperti struk kasir. Cetak akan langsung memanggil dialog print.</div></div></div>',foot:'<button class="btn" data-close2>Tutup</button><button class="btn btn-primary" id="svcPrint">Cetak Struk</button>'});
  m.$('[data-close2]').onclick = () => m.close();
  const draw=()=>$('#svcPreviewPaper',m.el).innerHTML=serviceReceiptMarkup(x,paper);
  $$('input[name="svcPaper"]',m.el).forEach(el=>el.addEventListener('change',()=>{paper=Number(el.value);draw();}));
  $('#svcPrint',m.el).onclick=()=>printService(x,paper);
  draw();
}
function printService(x,paper){ printDoc(serviceReceiptMarkup(x,paper),'size:'+paper+'mm auto;margin:0'); }

/* ---------- daftar layar ---------- */
Object.assign(ACT,{serviceNew(){serviceForm();},serviceEdit(t){run(t,async()=>serviceForm(await api('serviceGet',{id:Number(t.dataset.id)})));},servicePrint(t){run(t,async()=>openServicePreview(await api('serviceGet',{id:Number(t.dataset.id)})));}});
Object.assign(ACT, {
  quoteReset() { leaveQuoteOk().then(y => { if (y) { S.quote = newQuote(); S.quoteTab = 'form'; viewPenawaran(); } }); },
  quoteTab(t) { S.quoteTab = t.dataset.tab === 'list' ? 'list' : 'form'; viewPenawaran(); },
  quoteAddItem() { S.quote.items.push({ name: '', qty: 1, price: 0 }); markQuoteDirty(); renderQuoteItems(); renderQuoteTotals(); const ins = $('#qItems tbody tr:last-child input'); if (ins) { ins.focus(); } },
  quoteDelItem(t) { const i = Number(t.dataset.i); S.quote.items.splice(i, 1); if (!S.quote.items.length) { S.quote.items.push({ name: '', qty: 1, price: 0 }); } markQuoteDirty(); renderQuoteItems(); renderQuoteTotals(); },
  quoteSave(t) { run(t, () => saveQuote(false)); },
  quotePreview(t) { run(t, () => showQuotePreview()); },
  quoteOpen(t) {
    const id = Number(t.dataset.id);
    const open = () => run(t, async () => { const d = await api('quoteGet', { id }); S.quote = quoteFromServer(d); S.quoteTab = 'form'; viewPenawaran(); });
    if (S.quote && S.quote.id === id) { S.quoteTab = 'form'; viewPenawaran(); return; }
    leaveQuoteOk().then(y => { if (y) { open(); } });
  },
  quotePrintSaved(t) { run(t, async () => { const d = await api('quoteGet', { id: Number(t.dataset.id) }); await showQuotePreview(quoteFromServer(d)); }); },
  quoteDel(t) {
    const id = Number(t.dataset.id), no = t.dataset.no;
    confirmBox({ title: 'Hapus penawaran?', message: 'Penawaran <b>' + esc(no) + '</b> akan dihapus permanen dari database.', ok: 'Hapus', danger: true }).then(y => {
      if (!y) { return; }
      run(null, async () => {
        await api('quoteDelete', { ids: [id] });
        if (S.quote && S.quote.id === id) { S.quote = newQuote(); }
        toast('Penawaran ' + no + ' dihapus.', 'ok'); loadQuotes();
      });
    });
  }
});
Object.assign(INP, { quoteQ: debounce(t => { S.quoteQ = t.value; loadQuotes(); }, 250) });
Object.assign(VIEWS, {
  kasir() { viewKasir(); if (catalogStale) { catalogStale = false; refreshCatalog(true); } },
  dashboard: viewDashboard, riwayat: viewRiwayat, service: viewService, penawaran: viewPenawaran, produk: viewProduk, pelanggan: viewPelanggan,
  rekap: viewRekap, pengguna: viewPengguna, pengaturan: viewPengaturan
});

boot();
