<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HDT POS</title>
<style>
/* ===== HDT POS - tampilan ===== */
:root {
  --bg:#e8ecf2; --surface:#fff; --surface-2:#f2f5f9; --ink:#131c2b; --muted:#566276; --line:#d3dae5;
  --brand:#2f5bea; --brand-ink:#fff; --brand-soft:#e6ecff;
  --bar:#101827; --bar-ink:#e8edf6; --bar-line:#26324a;
  --lcd:#0e1626; --lcd-ink:#a4ecff;
  --pay:#16a34a; --pay-hover:#15803d;
  --ok:#0f7a3d; --ok-bg:#dcf5e5; --warn:#8a4300; --warn-bg:#fdecc8; --danger:#c62828; --danger-bg:#fde8e8;
  --shadow:0 10px 34px rgba(10,20,40,.2);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0a1019; --surface:#141c2a; --surface-2:#1a2435; --ink:#e6ebf5; --muted:#93a0b6; --line:#27334a;
    --brand:#7592ff; --brand-ink:#0b1424; --brand-soft:#1d2a52; --bar:#070c14; --bar-line:#1c2740; --lcd:#060a12;
    --ok:#6ee7a0; --ok-bg:#0f2e1c; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f8f; --danger-bg:#3a1517; --shadow:0 10px 34px rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ --bg:#0a1019; --surface:#141c2a; --surface-2:#1a2435; --ink:#e6ebf5; --muted:#93a0b6; --line:#27334a;
  --brand:#7592ff; --brand-ink:#0b1424; --brand-soft:#1d2a52; --bar:#070c14; --bar-line:#1c2740; --lcd:#060a12;
  --ok:#6ee7a0; --ok-bg:#0f2e1c; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f8f; --danger-bg:#3a1517; --shadow:0 10px 34px rgba(0,0,0,.6); }

*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ min-height:100%; margin:0; display:flex; flex-direction:column; font:15px/1.45 var(--font); color:var(--ink); background:var(--bg); font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent); outline-offset:1px; }
h1,h2,h3{ margin:0; line-height:1.2; }
kbd{ display:inline-block; padding:0 6px; margin-left:6px; font:600 12px/20px var(--font); border:1px solid currentColor; border-radius:5px; opacity:.65; }
.muted{ color:var(--muted); } .num{ text-align:right; } .nowrap{ white-space:nowrap; } .grow{ flex:1; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* progress bar */
#bar{ position:fixed; z-index:200; top:0; left:0; height:3px; width:0; background:var(--lcd-ink); box-shadow:0 0 8px var(--lcd-ink); transition:width .25s ease,opacity .3s; opacity:0; pointer-events:none; }
#bar.on{ opacity:1; width:70%; transition:width 6s cubic-bezier(.1,.6,.2,1); }
#bar.done{ width:100%; opacity:0; transition:width .15s,opacity .3s .15s; }

/* demo banner */
.demo-note{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:6px 12px; font-size:13px; color:#3d2a00; background:#ffe9a8; }
.demo-note button{ padding:2px 10px; color:inherit; background:transparent; border:1px solid currentColor; border-radius:6px; }

/* ---------- login ---------- */
.login{ flex:1; display:grid; place-items:center; padding:24px 16px; }
.login-card{ width:min(420px,100%); padding:28px 26px 24px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.login-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; margin-bottom:22px; }
.login-brand img{ display:block; width:min(300px,86%); height:auto; max-height:120px; margin:0 auto; padding:6px 10px; object-fit:contain; background:#fff; border-radius:10px; }
.login-brand h1{ font-size:20px; }
.login-brand p{ margin:2px 0 0; color:var(--muted); font-size:14px; }
.hint{ margin-top:16px; padding:10px 12px; font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:8px; }
.hint button{ margin:4px 6px 0 0; padding:3px 10px; font-size:13px; color:var(--brand); background:var(--brand-soft); border:0; border-radius:999px; }

/* ---------- form ---------- */
.field{ display:block; margin-bottom:14px; }
.field > span, .field-label{ display:block; margin-bottom:5px; font-size:13px; font-weight:600; color:var(--muted); }
.field small{ display:block; margin-top:4px; font-size:12px; color:var(--muted); }
input[type=text],input[type=password],input[type=number],input[type=email],input[type=date],input[type=search],select,textarea{
  width:100%; min-height:42px; padding:8px 12px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
textarea{ min-height:76px; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent); }
input[type=checkbox]{ width:18px; height:18px; accent-color:var(--brand); vertical-align:middle; }
.check{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 14px; }
@media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.money{ text-align:right; font-variant-numeric:tabular-nums; }
.form-error{ margin:10px 0 0; padding:9px 12px; font-size:14px; color:var(--danger); background:var(--danger-bg); border-radius:8px; }

/* ---------- tombol ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 16px; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; text-decoration:none; white-space:nowrap; }
.btn:hover:not(:disabled){ background:var(--surface-2); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); } .btn-primary:hover:not(:disabled){ background:color-mix(in srgb,var(--brand) 88%,#000); }
.btn-pay{ color:#fff; background:var(--pay); border-color:var(--pay); } .btn-pay:hover:not(:disabled){ background:var(--pay-hover); }
.btn-danger{ color:#fff; background:var(--danger); border-color:var(--danger); } .btn-danger:hover:not(:disabled){ background:color-mix(in srgb,var(--danger) 85%,#000); }
.btn-ghost{ background:transparent; } .btn-sm{ min-height:32px; padding:0 10px; font-size:13px; }
.btn-link{ min-height:0; padding:0; color:var(--brand); background:none; border:0; font-weight:600; }
.btn-link:hover{ text-decoration:underline; }

/* ---------- topbar ---------- */
.topbar{ min-height:56px; position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:8px 16px; color:var(--bar-ink); background:var(--bar); }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; max-width:300px; }
.brand-mark{ flex:none; display:grid; place-items:center; min-width:38px; height:38px; padding:0 6px; border-radius:9px; background:var(--lcd-ink); color:#0b1424; font-weight:800; font-size:14px; }
.brand-logo{ flex:none; height:38px; width:auto; max-width:110px; padding:3px 5px; object-fit:contain; background:#fff; border-radius:8px; }
.brand-name{ min-width:0; line-height:1.15; } .brand-name b{ display:block; overflow:hidden; font-size:15px; text-overflow:ellipsis; white-space:nowrap; } .brand-name small{ display:block; font-size:12px; opacity:.65; }
.who{ position:relative; }
.who-btn{ display:flex; align-items:center; gap:8px; min-height:40px; padding:0 10px; color:var(--bar-ink); background:transparent; border:1px solid var(--bar-line); border-radius:8px; text-align:left; }
.who-btn:hover{ background:rgba(255,255,255,.07); }
.who-btn b{ display:block; font-size:14px; line-height:1.1; } .who-btn small{ display:block; font-size:11px; opacity:.65; }
.menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:50; min-width:200px; padding:6px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.menu button{ display:block; width:100%; padding:9px 12px; text-align:left; background:none; border:0; border-radius:6px; }
.menu button:hover{ background:var(--surface-2); }
.menu hr{ margin:4px 0; border:0; border-top:1px solid var(--line); }
@media (max-width:820px){ .brand-name,.who-btn span.w{ display:none; } .brand{ max-width:130px; } .topbar{ gap:8px; padding:8px 10px; } }

.pwd-banner{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; font-size:14px; color:var(--warn); background:var(--warn-bg); }

/* ---------- halaman admin ---------- */
.page{ width:100%; max-width:1280px; margin:0 auto; padding:20px 16px 48px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.page-head h1{ font-size:24px; } .page-head p{ margin:4px 0 0; color:var(--muted); }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--line); }
.card-head h2{ font-size:16px; } .card-body{ padding:16px; }
.cols{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; margin-top:14px; }
@media (max-width:980px){ .cols{ grid-template-columns:1fr; } }
.stack > * + *{ margin-top:14px; }

.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ min-height:34px; padding:0 13px; font-size:14px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; }
.chip:hover{ color:var(--ink); } .chip[aria-pressed=true]{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); }
.range{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.range input[type=date]{ width:auto; min-height:34px; padding:2px 8px; }

.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
@media (max-width:1100px){ .kpis{ grid-template-columns:repeat(3,1fr); } } @media (max-width:640px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
.kpi{ padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.kpi span{ display:block; font-size:13px; color:var(--muted); }
.kpi b{ display:block; margin-top:4px; font-size:22px; line-height:1.15; overflow-wrap:anywhere; }
.kpi small{ display:block; margin-top:3px; font-size:12px; color:var(--muted); }
.kpi.dark{ background:var(--lcd); border-color:var(--lcd); } .kpi.dark span,.kpi.dark small{ color:#8fb3bf; } .kpi.dark b{ color:var(--lcd-ink); }
.up{ color:var(--ok); } .down{ color:var(--danger); }

.chart{ width:100%; height:auto; display:block; } .chart text{ font:11px var(--font); fill:var(--muted); } .chart .bar{ fill:var(--brand); } .chart .bar:hover{ fill:var(--lcd-ink); } .chart .grid{ stroke:var(--line); stroke-width:1; }
.hbar{ display:grid; grid-template-columns:96px 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:14px; }
.hbar i{ display:block; height:10px; border-radius:5px; background:var(--brand); min-width:2px; } .hbar .track{ height:10px; border-radius:5px; background:var(--surface-2); }


/* ---------- service modern ---------- */
.service-section{--accent:var(--brand);position:relative;margin-bottom:14px;padding:18px 18px 18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(10,20,40,.04)}
.service-section:last-child{margin-bottom:0}
.service-section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:0 4px 4px 0}
.service-section[data-accent=barang]{--accent:var(--ok)}
.service-section[data-accent=masalah]{--accent:var(--warn)}
.service-section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.service-section-title i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:15px;font-style:normal;flex:none}
.service-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.service-field{display:flex;flex-direction:column;gap:6px}
.service-field.full{grid-column:1/-1}
.service-field .sf-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.service-field .sf-label .req{color:var(--danger);margin-left:2px}
.service-field input,.service-field textarea{padding:11px 13px;font-size:14.5px;border-radius:11px;background:var(--surface-2);border:1.5px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s}
.service-field input:hover,.service-field textarea:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--surface) 20%)}
.service-field input:focus,.service-field textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.service-field textarea{resize:vertical;min-height:60px;line-height:1.4}
.service-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--brand-soft);color:var(--muted);font-size:13px}
.service-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.service-status-btn{min-height:58px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;transition:border-color .15s,background .15s,color .15s,transform .15s}
.service-status-btn small{font-weight:500;font-size:10.5px;color:var(--muted)}
.service-status-btn:hover{border-color:var(--line)}
.service-status-btn[aria-pressed=true]{color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 4px 10px -2px rgba(10,20,40,.25)}
.service-status-btn[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.service-status-btn[data-s=proses][aria-pressed=true]{background:var(--warn)}
.service-status-btn[data-s=tersedia][aria-pressed=true]{background:var(--brand)}
.service-status-btn[data-s=diambil][aria-pressed=true]{background:var(--ok)}
.service-preview{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.service-preview-paper{display:flex;justify-content:center;padding:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:auto}
.service-preview-paper .receipt{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sr-barcode{display:block;width:100%;height:38px;margin:9px auto 3px}
.sr-barcode-text{text-align:center;font-size:10px;letter-spacing:1px}
.service-paper-options{display:grid;gap:10px}
.service-paper-option{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.service-paper-option:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.service-paper-option input{margin-top:3px;accent-color:var(--brand)}
.service-paper-option b{display:block}
.service-paper-option small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:760px){.service-form-grid,.service-preview{grid-template-columns:1fr}.service-field.full{grid-column:auto}.service-status-grid{grid-template-columns:1fr}}

/* ---------- tabel ---------- */
.tscroll{ overflow-x:auto; }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
.t th,.t td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
.t th{ position:sticky; top:0; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--surface-2); white-space:nowrap; }
.t td.num,.t th.num{ text-align:right; } .t tbody tr:hover{ background:color-mix(in srgb,var(--brand) 5%,transparent); }
.t tr.sel{ background:var(--brand-soft) !important; }
.t .cbx{ width:42px; text-align:center; }
.t td small{ display:block; color:var(--muted); font-size:12px; }
.t tfoot td{ font-weight:700; background:var(--surface-2); }
.empty{ padding:36px 16px; text-align:center; color:var(--muted); } .empty strong{ display:block; margin-bottom:4px; color:var(--ink); }
.badge{ display:inline-block; padding:1px 9px; font-size:12px; font-weight:700; border-radius:999px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); }
.badge.ok{ color:var(--ok); background:var(--ok-bg); border-color:transparent; } .badge.warn{ color:var(--warn); background:var(--warn-bg); border-color:transparent; }
.badge.danger{ color:var(--danger); background:var(--danger-bg); border-color:transparent; } .badge.brand{ color:var(--brand); background:var(--brand-soft); border-color:transparent; }
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
.toolbar input[type=search]{ flex:1; min-width:180px; max-width:340px; } .toolbar select{ width:auto; }
.selbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 16px; color:var(--brand); background:var(--brand-soft); border-bottom:1px solid var(--line); font-weight:600; }
.stars{ color:#e0a100; letter-spacing:1px; white-space:nowrap; } .stars .off{ color:var(--line); }

/* ---------- modal & toast ---------- */
.modal{ position:fixed; z-index:100; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:5vh 12px 12px; overflow-y:auto; background:rgba(8,14,26,.55); }
.modal-card{ width:min(520px,100%); background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.modal-card.wide{ width:min(860px,100%); } .modal-card.xl{ width:min(900px,100%); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
.modal-head h2{ font-size:18px; } .modal-x{ width:34px; height:34px; font-size:20px; line-height:1; color:var(--muted); background:none; border:0; border-radius:8px; } .modal-x:hover{ background:var(--surface-2); }
.modal-body{ padding:18px; } .modal-foot{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:12px 18px; background:var(--surface-2); border-top:1px solid var(--line); }
.toasts{ position:fixed; z-index:300; right:14px; top:calc(70px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
.toast{ max-width:min(380px,92vw); padding:11px 16px; color:#fff; background:#1b2436; border-radius:10px; box-shadow:var(--shadow); font-size:14px; animation:tin .18s ease-out; }
.toast.err{ background:#b3261e; } .toast.ok{ background:#146c38; }
@keyframes tin{ from{ transform:translateY(-8px); opacity:0; } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

.seg{ display:inline-flex; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; }
.seg button{ min-height:34px; padding:0 16px; font-weight:600; color:var(--muted); background:none; border:0; border-radius:7px; }
.seg button[aria-pressed=true]{ color:var(--ink); background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.rolepick{ display:grid; gap:8px; }
.rolepick label{ display:flex; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
.rolepick label:has(input:checked){ border-color:var(--brand); background:var(--brand-soft); }
.rolepick b{ display:block; } .rolepick small{ color:var(--muted); }
.starpick{ display:flex; gap:4px; } .starpick button{ width:38px; height:38px; font-size:22px; color:var(--line); background:none; border:1px solid var(--line); border-radius:8px; } .starpick button.on{ color:#e0a100; border-color:#e0a100; background:color-mix(in srgb,#e0a100 12%,transparent); }
.logo-box{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:12px; background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; }
.logo-box img{ max-width:200px; max-height:70px; object-fit:contain; background:#fff; padding:4px; border-radius:6px; }

/* ---------- KASIR ---------- */
.kasir{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(360px,42%) minmax(0,1fr); gap:12px; padding:12px; }
.cart-panel,.catalog-panel{ display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.cart-head{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
.cart-head h2{ display:flex; align-items:center; gap:8px; font-size:17px; white-space:nowrap; }

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

/* ---------- transport ---------- */
let pending = 0;
function progress(d) {
  pending = Math.max(0, pending + d);
  const b = $('#bar'); if (!b) return;
  if (pending > 0) { b.classList.remove('done'); b.classList.add('on'); }
  else { b.classList.remove('on'); b.classList.add('done'); setTimeout(() => { if (!pending) b.classList.remove('done'); }, 500); }
}
function rawCall(action, payload) {
  if (IS_GAS) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => { try { resolve(JSON.parse(r)); } catch (e) { reject(new Error('Respons server tidak valid.')); } })
        .withFailureHandler(e => reject(new Error((e && e.message) || 'Tidak dapat terhubung ke server. Periksa koneksi internet.')))
        .apiCall(action, S.token || '', JSON.stringify(payload || {}));
    });
  }
  if (!IS_DEMO) { return Promise.reject(new Error('Backend tidak ditemukan.')); }
  return new Promise(res => setTimeout(() => res(JSON.parse(JSON.stringify(window.HDT_DEMO.handle(action, S.token || '', payload || {})))), 90));
}
async function api(action, payload) {
  progress(1);
  try {
    const r = await rawCall(action, payload);
    if (!r.ok) {
      const e = new Error(r.error || 'Terjadi kesalahan.'); e.code = r.code;
      if (r.code === 'AUTH') { authLost(r.error); }
      throw e;
    }
    return r.data;
  } finally { progress(-1); }
}
/** Jalankan aksi dengan tombol terkunci + tampilkan error sebagai toast. */
async function run(btn, fn) {
  if (btn) { if (btn.disabled) { return; } btn.disabled = true; }
  try { return await fn(); }
  catch (e) { if (e.code !== 'AUTH') { toast(e.message, 'err'); } }
  finally { if (btn) { btn.disabled = false; } }
}

/* ---------- toast & modal ---------- */
function toast(msg, type) {
  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);
}
const modals = [];
function openModal(o) {
  const prev = document.activeElement;
  const el = document.createElement('div'); el.className = 'modal';
  el.innerHTML = '<div class="modal-card ' + (o.size || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '">' +
    '<div class="modal-head"><h2>' + esc(o.title) + '</h2><button type="button" class="modal-x" data-close aria-label="Tutup">×</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') + '</div>';
  const m = {
    el, o, $: s => $(s, el), $$: s => $$(s, el),
    close() {
      if (o.beforeClose && o.beforeClose() === false) { return; }
      const i = modals.indexOf(m); if (i < 0) { return; } modals.splice(i, 1); el.remove();
      if (o.onClose) { o.onClose(); }
      if (prev && document.body.contains(prev)) { try { prev.focus(); } catch (e) {} }
    }
  };
  el.addEventListener('mousedown', e => { if (e.target === el && o.dismissable !== false) { m.close(); } });
  $('[data-close]', el).addEventListener('click', () => m.close());
  $('#modals').appendChild(el); modals.push(m);
  const f = $(o.focus || 'input:not([type=hidden]):not([type=checkbox]):not([type=radio]),textarea,select', el) || $('.modal-foot .btn-primary,.modal-foot .btn-pay', el);
  if (f) { setTimeout(() => { try { f.focus(); if (f.select && f.tagName === 'INPUT' && f.type !== 'date') { f.select(); } } catch (e) {} }, 30); }
  return m;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modals.length) { const m = modals[modals.length - 1]; if (m.o.dismissable !== false) { m.close(); } }
});
function confirmBox(o) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({
      title: o.title, size: '', dismissable: true,
      body: '<p style="margin:0 0 8px">' + o.message + '</p>' + (o.items && o.items.length ? '<ul class="muted" style="margin:8px 0 0;padding-left:20px">' + o.items.slice(0, 6).map(x => '<li>' + esc(x) + '</li>').join('') + (o.items.length > 6 ? '<li>dan ' + (o.items.length - 6) + ' lainnya…</li>' : '') + '</ul>' : ''),
      foot: '<button class="btn" data-no>Batal</button><button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-yes>' + esc(o.ok || 'Ya') + '</button>',
      onClose() { if (!done) { done = true; resolve(false); } }
    });
    $('[data-no]', m.el).onclick = () => m.close();
    $('[data-yes]', m.el).onclick = () => { done = true; m.close(); resolve(true); };
    $('[data-no]', m.el).focus();

}

/* ---------- cetak (struk, invoice, laporan) ---------- */
function printDoc(html, pageCss) {
  const root = $('#printRoot');
  root.innerHTML = html;
  $('#pageStyle').textContent = '@page{' + pageCss + '}';
  const imgs = $$('img', root).filter(i => !i.complete).map(i => new Promise(r => { i.onload = i.onerror = r; }));
  Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 1500))]).then(() => {
    document.body.classList.add('printing');
    let closed = false, safety;
    const done = () => {
      if (closed) { return; }
      closed = true;
      clearTimeout(safety);
      document.body.classList.remove('printing'); root.innerHTML = '';
      window.removeEventListener('afterprint', done);
      window.removeEventListener('focus', onFocus);
    };
    const onFocus = () => setTimeout(done, 300);
    window.addEventListener('afterprint', done);
    window.addEventListener('focus', onFocus);
    // Jaring pengaman: di sebagian browser/iframe, "afterprint" atau fokus kembali
    // tidak selalu terpicu, sehingga tombol di balik layar cetak jadi tak terlihat/tidak
    // berfungsi. Batas waktu ini memastikan tampilan selalu kembali normal.
    safety = setTimeout(done, 6000);
    try { window.print(); }
    catch (e) { done(); toast('Browser memblokir cetak. Buka aplikasi di tab sendiri lalu coba lagi.', 'err'); }
  });
}

/* ---------- pangkas ruang kosong di sekeliling logo ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak dapat dibaca.')); i.src = src; }); }
/** Mengembalikan canvas hasil pangkas, atau null bila tidak ada yang perlu dipangkas. */
function trimCanvas(img) {
  const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
  const k = Math.min(1, 1600 / nw), w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const cs = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
  const clear = cs.every(i => d[i + 3] < 20);
  const bg = [0, 1, 2].map(j => cs.reduce((a, i) => a + d[i + j], 0) / 4);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = at(x, y); if (d[i + 3] < 20) { continue; }
      if (!clear && Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) < 60) { continue; }
      if (x < x0) { x0 = x; } if (x > x1) { x1 = x; } if (y < y0) { y0 = y; } if (y > y1) { y1 = y; }
    }
  }
  if (x1 < 0) { return null; }
  const m = Math.max(2, Math.round(Math.max(w, h) * .015));
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw * ch >= w * h * .92) { return null; }
  const out = document.createElement('canvas'); out.width = Math.round(cw / k); out.height = Math.round(ch / k);
  const og = out.getContext('2d'); og.drawImage(img, x0 / k, y0 / k, cw / k, ch / k, 0, 0, out.width, out.height);
  if (!clear && (bg[0] + bg[1] + bg[2]) / 3 >= 200) {   // latar terang polos (mis. JPG berlatar abu-abu muda): jadikan transparan agar menyatu dengan kertas
    const im = og.getImageData(0, 0, out.width, out.height), q = im.data;
    for (let i = 0; i < q.length; i += 4) {
      const dist = Math.abs(q[i] - bg[0]) + Math.abs(q[i + 1] - bg[1]) + Math.abs(q[i + 2] - bg[2]);
      if (dist < 45) { q[i + 3] = 0; } else if (dist < 120) { q[i + 3] = Math.round(255 * (dist - 45) / 75); }
    }
    og.putImageData(im, 0, 0); out._alpha = true;
  }
  return out;
}
/** Logo yang ruang kosong di tepinya sudah dipangkas (di-cache). Dipakai di menu, login, struk, invoice, laporan. */
const TRIM = {};
async function trimmedSrc(src) {
  if (!src) { return ''; }
  if (TRIM[src]) { return TRIM[src]; }
  let out = src;
  try { const c = trimCanvas(await loadImg(src)); if (c) { out = c.toDataURL(c._alpha || !/^data:image\/jpeg/.test(src) ? 'image/png' : 'image/jpeg', .92); } } catch (e) { /* pakai logo asli */ }
  TRIM[src] = out; return out;
}
const LOGO = () => { const l = ST().store_logo; return l ? (TRIM[l] || l) : ''; };
const warmLogo = () => trimmedSrc(ST().store_logo);

/* =====================================================================
   PENAWARAN HARGA (quotation) — dibuat kasir/admin, format seperti invoice
   ===================================================================== */
const DEFAULT_QUOTE_NOTE = '1. Harga berlaku sampai dengan tanggal yang tercantum pada penawaran ini.\n2. Harga dapat berubah sewaktu-waktu setelah tanggal berlaku berakhir.\n3. Pembayaran dilakukan setelah kesepakatan/PO disetujui, sesuai ketentuan yang berlaku.\n4. Barang yang sudah dibeli tidak dapat ditukar atau dikembalikan.\n5. Untuk transaksi di atas Rp5.000.000 wajib memberikan DP minimal 50%.\n6. Dokumen ini adalah penawaran harga, bukan invoice atau bukti pembayaran.';
function newQuote() {
  return {
    no: '', customer: '', phone: '', addr: '', date: ymdNow(), validDays: 14,
    items: [{ name: '', qty: 1, price: 0 }],
    discType: 'percent', discValue: 0, taxRate: Number(ST().tax_rate) || 0,
    note: DEFAULT_QUOTE_NOTE
  };
}
function quoteTotals(q) {
  const subtotal = q.items.reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.price) || 0), 0);
  let disc = q.discType === 'percent' ? Math.round(subtotal * (Number(q.discValue) || 0) / 100) : Math.round(Number(q.discValue) || 0);
  disc = Math.max(0, Math.min(disc, subtotal));
  const taxable = subtotal - disc, tax = Math.round(taxable * (Number(q.taxRate) || 0) / 100);
  return { subtotal, disc, tax, grand: taxable + tax };
}
function nextQuoteNo() {
  const ymd = ymdNow().replace(/-/g, '').slice(2), key = 'hdt_quote_seq_' + ymd;

    '<div id="banner"></div><div class="shell" id="shell" data-nav="closed"><aside class="side" id="side" aria-label="Menu utama"><div class="side-head"><b>Menu</b><button type="button" class="side-x" data-act="closeNav" aria-label="Tutup menu">' + icon('close', 20) + '</button></div><nav id="nav"></nav></aside><div class="scrim" data-act="closeNav"></div><main id="view" tabindex="-1"></main></div>' +
    '<nav id="bnav" class="bnav" aria-label="Navigasi utama"></nav>';
  renderBanner(); S.navOverlay = false; applyNav(); renderBottomNav();
}
function renderBanner() {
  const b = $('#banner'); if (!b) { return; }
  b.innerHTML = S.defaultPw && S.user && S.user.role === 'admin' ? '<div class="pwd-banner"><span>Password akun <b>admin</b> masih bawaan (admin123).</span><button type="button" class="btn btn-sm" data-act="pwd">Ganti sekarang</button></div>' : '';
}
function renderNav() {
  const items = NAV.filter(n => n.roles.includes(S.user.role)); let g = '', h = '';
  items.forEach(n => {
    if (n.g !== g) { g = n.g; h += '<div class="grp">' + g + '</div>'; }
    h += '<button type="button" data-act="nav" data-v="' + n.id + '"' + (S.view === n.id ? ' aria-current="page"' : '') + '>' + icon(n.id) + '<span>' + n.label + '</span></button>';
  });
  $('#nav').innerHTML = h;
}
function renderBottomNav() {
  const bn = $('#bnav'); if (!bn) { return; }
  const role = S.user.role;
  const ids = BOTTOM_MAIN[role] || BOTTOM_MAIN.kasir;
  const items = ids.map(id => NAV.find(n => n.id === id)).filter(Boolean);
  let h = items.map(n => '<button type="button" data-act="nav" data-v="' + n.id + '"' + (S.view === n.id ? ' aria-current="page"' : '') + '>' + icon(n.id, 22) + '<span>' + n.label + '</span></button>').join('');
  const hasMore = NAV.some(n => n.roles.includes(role) && !ids.includes(n.id));
  if (hasMore) {
    h += '<button type="button" data-act="toggleNav"' + (!ids.includes(S.view) ? ' aria-current="page"' : '') + '>' + icon('menu', 22) + '<span>Lainnya</span></button>';
  }
  bn.innerHTML = h;
}
/* menu samping: di layar lebar menempel di kiri (bisa disembunyikan, pilihan diingat); di layar kecil berupa laci geser */
const mqOverlay = window.matchMedia('(max-width:1023px)');
function applyNav() {
  const sh = $('#shell'); if (!sh) { return; }
  let st;
  if (mqOverlay.matches) { st = S.navOverlay ? 'open' : 'closed'; }
  else { st = store.get('hdt_nav') || (window.innerWidth >= 1280 ? 'open' : 'closed'); }
  sh.dataset.nav = st;
  const b = $('.burger'); if (b) { b.setAttribute('aria-expanded', String(st === 'open')); }
}
if (mqOverlay.addEventListener) { mqOverlay.addEventListener('change', () => { S.navOverlay = false; applyNav(); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modals.length && S.navOverlay) { S.navOverlay = false; applyNav(); } });
function go(v) {
  const n = NAV.find(x => x.id === v);
  if (!n || !n.roles.includes(S.user.role)) { v = 'kasir'; }
  S.view = v; renderNav(); renderBottomNav(); document.body.classList.toggle('is-kasir', v === 'kasir'); S.navOverlay = false; applyNav();
  const view = $('#view'); view.scrollTop = 0; window.scrollTo(0, 0);
  try { VIEWS[v](); } catch (e) { viewError(e, () => go(v)); }
}

function changePassword() {
  const m = openModal({
    title: 'Ganti password', focus: '#pc',
    body: '<label class="field"><span>Password saat ini</span><input id="pc" type="password" autocomplete="current-password"></label>' +
      '<label class="field"><span>Password baru (min. 6 karakter)</span><input id="pn" type="password" autocomplete="new-password"></label>' +
      '<label class="field"><span>Ulangi password baru</span><input id="pn2" type="password" autocomplete="new-password"></label><div class="form-error" id="pe" hidden></div>',
    foot: '<button type="button" class="btn" data-close2>Batal</button><button type="button" class="btn btn-primary" id="ps">Simpan</button>'
  });
  m.$('[data-close2]').onclick = () => m.close();
  const save = () => {
    const err = m.$('#pe'); err.hidden = true;
    if (m.$('#pn').value !== m.$('#pn2').value) { err.textContent = 'Ulangi password baru tidak sama.'; err.hidden = false; return; }
    run(m.$('#ps'), async () => {
      try {
        const r = await api('passwordChange', { current: m.$('#pc').value, password: m.$('#pn').value });
        S.token = r.token; store.set('hdt_tok', r.token); S.defaultPw = false; renderBanner(); m.close(); toast('Password berhasil diganti.', 'ok');
      } catch (e) { if (e.code !== 'AUTH') { err.textContent = e.message; err.hidden = false; } }
    });
  };
  m.$('#ps').onclick = save;
  m.el.addEventListener('keydown', e => { if (e.key === 'Enter') { save(); } });
}

Object.assign(ACT, {
  nav(t) { go(t.dataset.v); },
  toggleNav() {
    const sh = $('#shell'); if (!sh) { return; }

    else { store.set('hdt_nav', sh.dataset.nav === 'open' ? 'closed' : 'open'); }
    applyNav(); if (mqOverlay.matches && S.navOverlay) { const f = $('#nav button'); if (f) { f.focus(); } }
  },
  closeNav() { S.navOverlay = false; applyNav(); },
  menu(t) { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); },
  pwd() { const m = $('#menu'); if (m) { m.hidden = true; } changePassword(); },
  theme() { $('#menu').hidden = true; cycleTheme(); },
  logout() { $('#menu').hidden = true; confirmBox({ title: 'Keluar?', message: S.cart.length ? 'Keranjang yang belum dibayar akan hilang.' : 'Anda akan keluar dari aplikasi.', ok: 'Keluar' }).then(y => { if (y) { store.del('hdt_tok'); showLogin(); } }); },
  demoReset() {

  }
});

document.addEventListener('keydown', e => {
  if (!S.token || !S.user || S.view !== 'kasir' || modals.length) { return; }

async function boot() {

const ICON_SCAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 9v6M11 9v6M15 9v6M18 9v6"/></svg>';
async function getQris() { if (S.qrisImg == null) { S.qrisImg = (await api('qrisGet')).image; } return S.qrisImg; }
const custOf = () => S.customers.find(c => c.id === S.customerId) || null;

function calcCart() {
  const sub = S.cart.reduce((a, l) => a + l.price * l.qty, 0);
  const v = Number(S.discValue) || 0;
  let disc = S.discType === 'percent' ? Math.round(sub * Math.min(v, 100) / 100) : Math.round(v);
  disc = Math.min(disc, sub);
  const tax = Math.round((sub - disc) * (ST().tax_rate || 0) / 100);
  return { sub, disc, tax, grand: sub - disc + tax };
}

function viewKasir() {
  $('#view').innerHTML =
    '<div class="kasir" id="kasir" data-pane="' + S.pane + '">' +
    '<section class="cart-panel" aria-label="Keranjang belanja">' +
      '<div class="cart-head"><h2>Keranjang <span class="pill" id="cartCount">0</span></h2>' +

      '<button type="button" class="btn btn-sm btn-ghost" data-act="clearCart" id="clearBtn">Kosongkan</button></div>' +
      '<div class="cart-scroll" id="cartList"></div>' +
      '<div class="summary">' +
        '<div class="sum-row"><span>Subtotal</span><b id="sSub">Rp 0</b></div>' +
        '<div class="sum-row"><label for="dVal">Diskon</label><div class="disc-ctl"><select id="dType" aria-label="Jenis diskon"><option value="percent">%</option><option value="amount">Rp</option></select>' +
        '<input id="dVal" type="text" inputmode="numeric" class="money" placeholder="0" autocomplete="off"></div></div>' +
        '<div class="sum-row" id="rowDisc" hidden><span class="muted">Potongan diskon</span><span id="sDisc"></span></div>' +
        '<div class="sum-row" id="rowTax" hidden><span id="taxLbl" class="muted"></span><span id="sTax"></span></div>' +
        '<div class="lcd"><span>TOTAL</span><strong id="sTotal">Rp 0</strong></div>' +
        '<button type="button" class="pay-btn" id="payBtn" data-act="pay" disabled>BAYAR <kbd>F9</kbd></button>' +
      '</div>' +
    '</section>' +
    '<section class="catalog-panel" aria-label="Katalog produk">' +
      '<div class="catalog-head"><div class="scan">' + ICON_SCAN + '<input id="scan" type="search" placeholder="Scan barcode atau cari produk…" autocomplete="off" aria-label="Scan barcode atau cari produk"><kbd>F2</kbd></div>' +
      '<div class="cat-bar" id="catBar"></div></div>' +
      '<div class="product-grid" id="grid"></div>' +
    '</section>' +
    '<div class="pane-switch"><button type="button" data-act="pane" data-pane="catalog">Produk</button><button type="button" class="pri" data-act="pane" data-pane="cart" id="paneCart">Keranjang</button></div>' +
    '</div>';
  const scan = $('#scan'); scan.value = S.q;
  scan.addEventListener('input', () => { S.q = scan.value; renderCatalog(); });
  scan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); scanEnter(); } });
  $('#dType').value = S.discType; $('#dVal').value = S.discValue ? moneyTxt(S.discValue) : '';
  $('#dType').addEventListener('change', e => { S.discType = e.target.value; if (S.discType === 'percent' && S.discValue > 100) { S.discValue = 100; $('#dVal').value = '100'; } renderCart(); });
  $('#dVal').addEventListener('input', e => {
    let v = moneyVal(e.target.value); if (S.discType === 'percent' && v > 100) { v = 100; }
    S.discValue = v; e.target.value = v ? moneyTxt(v) : ''; renderTotals();
  });
  $('#cartList').addEventListener('change', e => {
    const i = e.target.closest('.qin'); if (!i) { return; }
    setQty(Number(i.dataset.i), moneyVal(i.value) || 1, true);
  });

  if (window.matchMedia('(min-width:901px)').matches) { scan.focus(); }
}

function renderCatalog() {
  const bar = $('#catBar'), grid = $('#grid'); if (!bar || !grid) { return; }
  const cats = ['all'].concat(S.categories.filter(c => S.products.some(p => p.category === c)));
  if (S.products.some(p => !p.category)) { cats.push('__none'); }
  if (!cats.includes(S.cat)) { S.cat = 'all'; }
  bar.innerHTML = cats.map(c => '<button type="button" class="chip" aria-pressed="' + (S.cat === c) + '" data-act="cat" data-cat="' + esc(c) + '">' + (c === 'all' ? 'Semua' : c === '__none' ? 'Lainnya' : esc(c)) + '</button>').join('');
  const q = S.q.trim().toLowerCase();
  const list = S.products.filter(p => (S.cat === 'all' || (S.cat === '__none' ? !p.category : p.category === S.cat)) &&
    (!q || (p.name + ' ' + p.sku + ' ' + p.barcode).toLowerCase().includes(q)));
  grid.innerHTML = list.length ? list.map(p => {
    const out = p.track_stock && p.stock <= 0, low = p.track_stock && !out && p.stock <= p.min_stock;
    const st = p.type === 'jasa' ? '<span class="st">Jasa</span>' : !p.track_stock ? '<span class="st">' + esc(p.unit) + '</span>' : out ? '<span class="st out">Stok habis</span>' : '<span class="st' + (low ? ' low' : '') + '">' + (low ? 'Menipis · ' : 'Stok ') + int(p.stock) + ' ' + esc(p.unit) + '</span>';
    return '<button type="button" class="pcard" data-act="add" data-id="' + p.id + '"' + (out ? ' disabled' : '') + '><span class="nm">' + esc(p.name) + '</span>' + st + '<span class="pr">' + rp(p.price) + '</span></button>';
  }).join('') : '<div class="empty" style="grid-column:1/-1"><strong>Produk tidak ditemukan</strong>' + (S.products.length ? 'Coba kata kunci lain.' : (S.user.role === 'admin' ? 'Tambahkan produk lewat menu Produk.' : 'Belum ada produk. Hubungi Kasir Admin.')) + '</div>';
}

function scanEnter() {
  const q = S.q.trim(); if (!q) { return; }
  const ql = q.toLowerCase();
  let p = S.products.find(x => x.barcode && x.barcode === q) || S.products.find(x => x.sku && x.sku.toLowerCase() === ql);
  if (!p) {
    const m = S.products.filter(x => (x.name + ' ' + x.sku + ' ' + x.barcode).toLowerCase().includes(ql));
    if (m.length === 1) { p = m[0]; }
    else { toast(m.length ? 'Ada ' + m.length + ' produk cocok — pilih dari daftar.' : 'Produk "' + q + '" tidak ditemukan.', m.length ? '' : 'err'); return; }
  }
  addToCart(p); S.q = ''; $('#scan').value = ''; renderCatalog();
}

function addToCart(p) {
  if (p.track_stock && p.stock <= 0) { toast('Stok "' + p.name + '" habis.', 'err'); return; }
  const l = S.cart.find(x => x.product_id === p.id);
  if (l) { setQty(S.cart.indexOf(l), l.qty + 1, false); return; }
  S.cart.push({ product_id: p.id, name: p.name, price: p.price, qty: 1, unit: p.unit, tracked: p.track_stock, max: p.track_stock ? p.stock : 999999 });
  renderCart();
}
function setQty(i, q, fromInput) {
  const l = S.cart[i]; if (!l) { return; }
  if (q < 1) { S.cart.splice(i, 1); renderCart(); return; }
  if (q > l.max) { q = l.max; toast('Stok "' + l.name + '" hanya ' + int(l.max) + ' ' + l.unit + '.', 'err'); }
  l.qty = q; renderCart();
  if (fromInput) { const inp = $('.qin[data-i="' + i + '"]'); if (inp) { inp.focus(); inp.select(); } }
}

function renderCart() {
  const list = $('#cartList'); if (!list) { return; }
  const count = S.cart.reduce((a, l) => a + l.qty, 0);
  $('#cartCount').textContent = int(count);
  $('#paneCart').textContent = 'Keranjang' + (S.cart.length ? ' · ' + rp(calcCart().grand) : '');
  $('#clearBtn').hidden = !S.cart.length;
  const cu = custOf();
  const cb = $('#custBtn'); cb.className = 'cust-btn' + (cu ? ' on' : '');
  cb.innerHTML = '<span aria-hidden="true">👤</span><span>' + (cu ? esc(cu.name) : 'Pelanggan umum') + '</span>';
  list.innerHTML = S.cart.length ? S.cart.map((l, i) =>
    '<div class="cart-line"><div><div class="nm">' + esc(l.name) + '</div><div class="pr">' + rp(l.price) + ' / ' + esc(l.unit) + '</div></div><div class="sub">' + rp(l.price * l.qty) + '</div>' +
    '<div class="ctl"><div class="qty"><button type="button" data-act="dec" data-i="' + i + '" aria-label="Kurangi">−</button>' +
    '<input class="qin" data-i="' + i + '" type="text" inputmode="numeric" value="' + l.qty + '" aria-label="Jumlah ' + esc(l.name) + '">' +
    '<button type="button" data-act="inc" data-i="' + i + '" aria-label="Tambah">+</button></div>' +
    '<button type="button" class="rm" data-act="rm" data-i="' + i + '" aria-label="Hapus ' + esc(l.name) + '">Hapus</button></div></div>').join('')
    : '<div class="empty"><strong>Keranjang kosong</strong>Scan barcode atau pilih produk di sebelah.</div>';
  renderTotals();
}
function renderTotals() {
  const c = calcCart();
  $('#sSub').textContent = rp(c.sub);
  $('#rowDisc').hidden = !c.disc; $('#sDisc').textContent = '-' + rp(c.disc);
  $('#rowTax').hidden = !(ST().tax_rate > 0); $('#taxLbl').textContent = 'Pajak (' + (ST().tax_rate || 0) + '%)'; $('#sTax').textContent = rp(c.tax);
  $('#sTotal').textContent = rp(c.grand);
  $('#payBtn').disabled = !S.cart.length;
  const pc = $('#paneCart'); if (pc) { pc.textContent = 'Keranjang' + (S.cart.length ? ' · ' + rp(c.grand) : ''); }
}

/* ----- pembayaran ----- */
function openPay() {
  if (!S.cart.length || modals.length) { return; }
  const c = calcCart(); let method = 'cash';
  const m = openModal({
    title: 'Pembayaran', focus: '#paid',
    body: '<div class="pay-total"><span>Total bayar</span><strong>' + rp(c.grand) + '</strong></div>' +
      '<div class="method-grid" role="group" aria-label="Metode pembayaran">' + Object.keys(PAY).map(k => '<button type="button" class="method" data-m="' + k + '" aria-pressed="' + (k === 'cash') + '">' + PAY[k] + '</button>').join('') + '</div>' +
      '<div id="cashBox"><label class="field" style="margin-bottom:0"><span>Uang diterima</span><input id="paid" class="money-input" type="text" inputmode="numeric" autocomplete="off"></label>' +
      '<div class="quick" id="quick"></div><div class="change-row" id="chg"><span>Kembalian</span><strong>Rp 0</strong></div></div><div id="qrisBox" hidden></div>' +
      '<label class="field" style="margin-top:14px"><span>Catatan (opsional)</span><input id="note" type="text" maxlength="200" autocomplete="off"></label>' +
      '<div id="invNote"></div><div class="form-error" id="payErr" hidden></div>',
    foot: '<button type="button" class="btn" data-close2>Batal</button><button type="button" class="btn btn-pay" id="payGo">Proses pembayaran</button>'
  });
  const paid = m.$('#paid');
  const cashCalc = () => {
    const v = moneyVal(paid.value), d = v - c.grand, box = m.$('#chg');
    box.className = 'change-row' + (v && d < 0 ? ' short' : '');
    box.innerHTML = '<span>' + (v && d < 0 ? 'Kurang' : 'Kembalian') + '</span><strong>' + rp(v ? Math.abs(d) : 0) + '</strong>';
  };
  const q = [c.grand, Math.ceil(c.grand / 10000) * 10000, Math.ceil(c.grand / 50000) * 50000, Math.ceil(c.grand / 100000) * 100000];
  m.$('#quick').innerHTML = q.filter((v, i) => q.indexOf(v) === i).slice(0, 4).map((v, i) => '<button type="button" data-v="' + v + '">' + (v === c.grand ? 'Uang pas' : rp(v)) + '</button>').join('');
  m.$('#quick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { paid.value = moneyTxt(b.dataset.v); cashCalc(); paid.focus(); } });
  paid.addEventListener('input', () => { paid.value = moneyTxt(paid.value); cashCalc(); });
  const invHint = () => {
    const cu = custOf(), el = m.$('#invNote');
    if (cu && (method === 'cash' || method === 'transfer')) { el.className = 'note-inv'; el.textContent = 'Pelanggan terdaftar (' + cu.name + '): invoice A4 dapat dicetak / disimpan sebagai PDF setelah pembayaran.'; }
    else if (method === 'qris' && !ST().qris_ready) { el.className = 'muted'; el.style.cssText = 'margin-top:10px;font-size:13px'; el.textContent = 'Gambar QRIS belum diunggah' + (S.user.role === 'admin' ? ' (Pengaturan → Pembayaran QRIS).' : '. Hubungi Kasir Admin.'); }
    else if (!cu && (method === 'cash' || method === 'transfer')) { el.className = 'muted'; el.style.cssText = 'margin-top:10px;font-size:13px'; el.textContent = 'Butuh invoice? Tutup, lalu pilih pelanggan terdaftar di keranjang.'; }
    else { el.className = ''; el.textContent = ''; }
  };
  const goText = () => (method === 'qris' && ST().qris_ready) ? 'Pembayaran sudah diterima' : 'Proses pembayaran';
  const showQris = async () => {
    const box = m.$('#qrisBox'), on = method === 'qris' && ST().qris_ready;
    box.hidden = !on; m.$('#payGo').textContent = goText(); if (!on) { return; }
    box.innerHTML = '<div class="muted" style="text-align:center;padding:24px">Memuat QRIS…</div>';
    try {
      const img = await getQris(); if (method !== 'qris') { return; }
      box.innerHTML = '<div class="qris-view"><img src="' + esc(img) + '" alt="QRIS untuk pembayaran"><p><b>Minta pelanggan scan QRIS ini</b> lalu bayar <b>' + rp(c.grand) + '</b>.</p><p class="muted">QRIS statis: nominal diketik sendiri oleh pelanggan. Tekan tombol hijau setelah dana benar-benar masuk.</p></div>';
    } catch (e) { box.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>'; }
  };

const PRESETS = [['today', 'Hari ini'], ['7', '7 hari'], ['30', '30 hari'], ['month', 'Bulan ini'], ['lastmonth', 'Bulan lalu'], ['custom', 'Kustom']];
function presetRange(p) {
  const t = ymdNow();
  if (p === 'today') { return [t, t]; }
  if (p === '7') { return [addD(t, -6), t]; }
  if (p === '30') { return [addD(t, -29), t]; }
  if (p === 'month') { return [t.slice(0, 8) + '01', t]; }
  if (p === 'lastmonth') { const end = addD(t.slice(0, 8) + '01', -1); return [end.slice(0, 8) + '01', end]; }
  return null;
}
S.dash = { preset: '7', from: presetRange('7')[0], to: presetRange('7')[1], type: 'all', q: '', data: null };
S.rek = { preset: 'month', from: presetRange('month')[0], to: presetRange('month')[1], data: null };

function rangeBar(scope) {
  const R = S[scope];
  return '<div class="range"><div class="chips" role="group" aria-label="Periode">' + PRESETS.map(p => '<button type="button" class="chip" aria-pressed="' + (R.preset === p[0]) + '" data-act="preset" data-scope="' + scope + '" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
    '<div class="actions"><label class="muted" for="' + scope + 'F">Dari</label><input type="date" id="' + scope + 'F" value="' + R.from + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '">' +
    '<label class="muted" for="' + scope + 'T">sampai</label><input type="date" id="' + scope + 'T" value="' + R.to + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '"></div></div>';
}
const periodTxt = r => r.from === r.to ? dmy(r.from) : dmy(r.from) + ' – ' + dmy(r.to);
const shortRp = v => v >= 1e9 ? (v / 1e9).toFixed(1).replace('.', ',') + ' M' : v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace('.', ',') + ' jt' : v >= 1e3 ? Math.round(v / 1e3) + ' rb' : String(Math.round(v));
function niceMax(v) { if (v <= 0) { return 1; } const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart(data, h) {
  h = h || 210; const vw = $('#view') ? $('#view').clientWidth : 720, W = Math.max(280, Math.min(760, vw - 60)), L = 50, B = 26, T = 10, R = 6, pw = W - L - R, ph = h - B - T;
  const max = niceMax(Math.max.apply(null, data.map(d => d.sales).concat([0])));
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + shortRp(max * i / 4) + '</text>'; }
  const n = data.length, slot = pw / n, bw = Math.min(46, Math.max(2, slot * .68)), step = Math.ceil(n / Math.max(3, Math.floor(pw / 58)));
  data.forEach((d, i) => {
    const bh = d.sales / max * ph, x = L + slot * i + (slot - bw) / 2;
    g += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + (T + ph - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, d.sales ? 1 : 0).toFixed(1) + '" rx="2"><title>' + dmy(d.date) + ': ' + rp(d.sales) + (d.tx !== undefined ? ' · ' + d.tx + ' transaksi' : '') + '</title></rect>';
    if (i % step === 0) { g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + dshort(d.date) + '</text>'; }
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="Grafik penjualan per hari">' + g + '</svg>';
}

async function deleteSelected(key) {
  const L = LISTS[key], ids = Array.from(S.sel[key]); if (!ids.length) { return; }

/** Perkecil gambar QRIS (tanpa dipangkas agar tetap terbaca) hingga cukup kecil untuk disimpan di Sheet. */
function shrinkQris(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height)), out = '';
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', .9); if (out.length <= 300000) { return resolve(out); } scale *= .85;
      }
      reject(new Error('Gambar QRIS terlalu besar. Gunakan gambar yang lebih kecil.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let base = img; try { base = trimCanvas(img) || img; } catch (e) { base = img; }   // buang ruang kosong di sekeliling logo
      const bw = base.naturalWidth || base.width, bh = base.naturalHeight || base.height;
      let scale = Math.min(1, 800 / bw, 320 / bh), out = '';
      const png = file.type !== 'image/jpeg' || !!base._alpha;
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bw * scale)); c.height = Math.max(1, Math.round(bh * scale));
        const g = c.getContext('2d'); if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(base, 0, 0, c.width, c.height); out = c.toDataURL(png ? 'image/png' : 'image/jpeg', .9);
        if (out.length <= 200000) { return resolve(out); } scale *= .8;
      }
      reject(new Error('Gambar terlalu kompleks. Gunakan logo yang lebih sederhana.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}

function serviceStatusLabel(s){return ({proses:'Masih proses',tersedia:'Masih di tempat',diambil:'Sudah diambil'}[s]||s||'-');}
function serviceBarcodeMarkup(value){
  value=String(value||'SERVICE');
  let bits='101';
  for(let i=0;i<value.length;i++){
    const n=value.charCodeAt(i);
    bits += (n.toString(2).padStart(8,'0'))+'0';
  }
  bits += '10101';
  let x=0, bars='';
  for(let i=0;i<bits.length;i++){
    if(bits[i]==='1') bars += '<rect x="'+x+'" y="0" width="1" height="38" fill="#000"/>';
    x++;
  }
  return '<svg class="sr-barcode" viewBox="0 0 '+x+' 38" preserveAspectRatio="none" role="img" aria-label="Barcode '+esc(value)+'">'+bars+'</svg><div class="sr-barcode-text">'+esc(value)+'</div>';
}
