<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HDT POS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>HDT POS</title>
<style>
/* ===== HDT POS - tampilan ===== */
:root {
  --bg:#e8ecf2; --surface:#fff; --surface-2:#f2f5f9; --ink:#131c2b; --muted:#566276; --line:#d3dae5;
  --brand:#2f5bea; --brand-ink:#fff; --brand-soft:#e6ecff;
  --bar:#101827; --bar-ink:#e8edf6; --bar-line:#26324a;
  --lcd:#0e1626; --lcd-ink:#a4ecff;
  --pay:#16a34a; --pay-hover:#15803d;
  --ok:#0f7a3d; --ok-bg:#dcf5e5; --warn:#8a4300; --warn-bg:#fdecc8; --danger:#c62828; --danger-bg:#fde8e8;
  --shadow:0 10px 34px rgba(10,20,40,.2);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0a1019; --surface:#141c2a; --surface-2:#1a2435; --ink:#e6ebf5; --muted:#93a0b6; --line:#27334a;
    --brand:#7592ff; --brand-ink:#0b1424; --brand-soft:#1d2a52; --bar:#070c14; --bar-line:#1c2740; --lcd:#060a12;
    --ok:#6ee7a0; --ok-bg:#0f2e1c; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f8f; --danger-bg:#3a1517; --shadow:0 10px 34px rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ --bg:#0a1019; --surface:#141c2a; --surface-2:#1a2435; --ink:#e6ebf5; --muted:#93a0b6; --line:#27334a;
  --brand:#7592ff; --brand-ink:#0b1424; --brand-soft:#1d2a52; --bar:#070c14; --bar-line:#1c2740; --lcd:#060a12;
  --ok:#6ee7a0; --ok-bg:#0f2e1c; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f8f; --danger-bg:#3a1517; --shadow:0 10px 34px rgba(0,0,0,.6); }

*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ min-height:100%; margin:0; display:flex; flex-direction:column; font:15px/1.45 var(--font); color:var(--ink); background:var(--bg); font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent); outline-offset:1px; }
h1,h2,h3{ margin:0; line-height:1.2; }
kbd{ display:inline-block; padding:0 6px; margin-left:6px; font:600 12px/20px var(--font); border:1px solid currentColor; border-radius:5px; opacity:.65; }
.muted{ color:var(--muted); } .num{ text-align:right; } .nowrap{ white-space:nowrap; } .grow{ flex:1; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* progress bar */
#bar{ position:fixed; z-index:200; top:0; left:0; height:3px; width:0; background:var(--lcd-ink); box-shadow:0 0 8px var(--lcd-ink); transition:width .25s ease,opacity .3s; opacity:0; pointer-events:none; }
#bar.on{ opacity:1; width:70%; transition:width 6s cubic-bezier(.1,.6,.2,1); }
#bar.done{ width:100%; opacity:0; transition:width .15s,opacity .3s .15s; }

/* demo banner */
.demo-note{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:6px 12px; font-size:13px; color:#3d2a00; background:#ffe9a8; }
.demo-note button{ padding:2px 10px; color:inherit; background:transparent; border:1px solid currentColor; border-radius:6px; }

/* ---------- login ---------- */
.login{ flex:1; display:grid; place-items:center; padding:24px 16px; }
.login-card{ width:min(420px,100%); padding:28px 26px 24px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.login-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; margin-bottom:22px; }
.login-brand img{ display:block; width:min(300px,86%); height:auto; max-height:120px; margin:0 auto; padding:6px 10px; object-fit:contain; background:#fff; border-radius:10px; }
.login-brand h1{ font-size:20px; }
.login-brand p{ margin:2px 0 0; color:var(--muted); font-size:14px; }
.hint{ margin-top:16px; padding:10px 12px; font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:8px; }
.hint button{ margin:4px 6px 0 0; padding:3px 10px; font-size:13px; color:var(--brand); background:var(--brand-soft); border:0; border-radius:999px; }

/* ---------- form ---------- */
.field{ display:block; margin-bottom:14px; }
.field > span, .field-label{ display:block; margin-bottom:5px; font-size:13px; font-weight:600; color:var(--muted); }
.field small{ display:block; margin-top:4px; font-size:12px; color:var(--muted); }
input[type=text],input[type=password],input[type=number],input[type=email],input[type=date],input[type=search],select,textarea{
  width:100%; min-height:42px; padding:8px 12px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
textarea{ min-height:76px; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent); }
input[type=checkbox]{ width:18px; height:18px; accent-color:var(--brand); vertical-align:middle; }
.check{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 14px; }
@media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.money{ text-align:right; font-variant-numeric:tabular-nums; }
.form-error{ margin:10px 0 0; padding:9px 12px; font-size:14px; color:var(--danger); background:var(--danger-bg); border-radius:8px; }

/* ---------- tombol ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 16px; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; text-decoration:none; white-space:nowrap; }
.btn:hover:not(:disabled){ background:var(--surface-2); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); } .btn-primary:hover:not(:disabled){ background:color-mix(in srgb,var(--brand) 88%,#000); }
.btn-pay{ color:#fff; background:var(--pay); border-color:var(--pay); } .btn-pay:hover:not(:disabled){ background:var(--pay-hover); }
.btn-danger{ color:#fff; background:var(--danger); border-color:var(--danger); } .btn-danger:hover:not(:disabled){ background:color-mix(in srgb,var(--danger) 85%,#000); }
.btn-ghost{ background:transparent; } .btn-sm{ min-height:32px; padding:0 10px; font-size:13px; }
.btn-link{ min-height:0; padding:0; color:var(--brand); background:none; border:0; font-weight:600; }
.btn-link:hover{ text-decoration:underline; }

/* ---------- topbar ---------- */
.topbar{ min-height:56px; position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:8px 16px; color:var(--bar-ink); background:var(--bar); }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; max-width:300px; }
.brand-mark{ flex:none; display:grid; place-items:center; min-width:38px; height:38px; padding:0 6px; border-radius:9px; background:var(--lcd-ink); color:#0b1424; font-weight:800; font-size:14px; }
.brand-logo{ flex:none; height:38px; width:auto; max-width:110px; padding:3px 5px; object-fit:contain; background:#fff; border-radius:8px; }
.brand-name{ min-width:0; line-height:1.15; } .brand-name b{ display:block; overflow:hidden; font-size:15px; text-overflow:ellipsis; white-space:nowrap; } .brand-name small{ display:block; font-size:12px; opacity:.65; }
.who{ position:relative; }
.who-btn{ display:flex; align-items:center; gap:8px; min-height:40px; padding:0 10px; color:var(--bar-ink); background:transparent; border:1px solid var(--bar-line); border-radius:8px; text-align:left; }
.who-btn:hover{ background:rgba(255,255,255,.07); }
.who-btn b{ display:block; font-size:14px; line-height:1.1; } .who-btn small{ display:block; font-size:11px; opacity:.65; }
.menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:50; min-width:200px; padding:6px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.menu button{ display:block; width:100%; padding:9px 12px; text-align:left; background:none; border:0; border-radius:6px; }
.menu button:hover{ background:var(--surface-2); }
.menu hr{ margin:4px 0; border:0; border-top:1px solid var(--line); }
@media (max-width:820px){ .brand-name,.who-btn span.w{ display:none; } .brand{ max-width:130px; } .topbar{ gap:8px; padding:8px 10px; } }

.pwd-banner{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; font-size:14px; color:var(--warn); background:var(--warn-bg); }

/* ---------- halaman admin ---------- */
.page{ width:100%; max-width:1280px; margin:0 auto; padding:20px 16px 48px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.page-head h1{ font-size:24px; } .page-head p{ margin:4px 0 0; color:var(--muted); }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--line); }
.card-head h2{ font-size:16px; } .card-body{ padding:16px; }
.cols{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; margin-top:14px; }
@media (max-width:980px){ .cols{ grid-template-columns:1fr; } }
.stack > * + *{ margin-top:14px; }

.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ min-height:34px; padding:0 13px; font-size:14px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; }
.chip:hover{ color:var(--ink); } .chip[aria-pressed=true]{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); }
.range{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.range input[type=date]{ width:auto; min-height:34px; padding:2px 8px; }

.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
@media (max-width:1100px){ .kpis{ grid-template-columns:repeat(3,1fr); } } @media (max-width:640px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
.kpi{ padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.kpi span{ display:block; font-size:13px; color:var(--muted); }
.kpi b{ display:block; margin-top:4px; font-size:22px; line-height:1.15; overflow-wrap:anywhere; }
.kpi small{ display:block; margin-top:3px; font-size:12px; color:var(--muted); }
.kpi.dark{ background:var(--lcd); border-color:var(--lcd); } .kpi.dark span,.kpi.dark small{ color:#8fb3bf; } .kpi.dark b{ color:var(--lcd-ink); }
.up{ color:var(--ok); } .down{ color:var(--danger); }

.chart{ width:100%; height:auto; display:block; } .chart text{ font:11px var(--font); fill:var(--muted); } .chart .bar{ fill:var(--brand); } .chart .bar:hover{ fill:var(--lcd-ink); } .chart .grid{ stroke:var(--line); stroke-width:1; }
.hbar{ display:grid; grid-template-columns:96px 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:14px; }
.hbar i{ display:block; height:10px; border-radius:5px; background:var(--brand); min-width:2px; } .hbar .track{ height:10px; border-radius:5px; background:var(--surface-2); }


/* ---------- service modern ---------- */
.service-section{--accent:var(--brand);position:relative;margin-bottom:14px;padding:18px 18px 18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(10,20,40,.04)}
.service-section:last-child{margin-bottom:0}
.service-section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:0 4px 4px 0}
.service-section[data-accent=barang]{--accent:var(--ok)}
.service-section[data-accent=masalah]{--accent:var(--warn)}
.service-section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.service-section-title i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:15px;font-style:normal;flex:none}
.service-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.service-field{display:flex;flex-direction:column;gap:6px}
.service-field.full{grid-column:1/-1}
.service-field .sf-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.service-field .sf-label .req{color:var(--danger);margin-left:2px}
.service-field input,.service-field textarea{padding:11px 13px;font-size:14.5px;border-radius:11px;background:var(--surface-2);border:1.5px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s}
.service-field input:hover,.service-field textarea:hover{background:color-mix(in srgb,var(--surface-2) 80%,var(--surface) 20%)}
.service-field input:focus,.service-field textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.service-field textarea{resize:vertical;min-height:60px;line-height:1.4}
.service-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--brand-soft);color:var(--muted);font-size:13px}
.service-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.service-status-btn{min-height:58px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;transition:border-color .15s,background .15s,color .15s,transform .15s}
.service-status-btn small{font-weight:500;font-size:10.5px;color:var(--muted)}
.service-status-btn:hover{border-color:var(--line)}
.service-status-btn[aria-pressed=true]{color:#fff;border-color:transparent;transform:translateY(-1px);box-shadow:0 4px 10px -2px rgba(10,20,40,.25)}
.service-status-btn[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.service-status-btn[data-s=proses][aria-pressed=true]{background:var(--warn)}
.service-status-btn[data-s=tersedia][aria-pressed=true]{background:var(--brand)}
.service-status-btn[data-s=diambil][aria-pressed=true]{background:var(--ok)}
.service-preview{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.service-preview-paper{display:flex;justify-content:center;padding:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:auto}
.service-preview-paper .receipt{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sr-barcode{display:block;width:100%;height:38px;margin:9px auto 3px}
.sr-barcode-text{text-align:center;font-size:10px;letter-spacing:1px}
.service-paper-options{display:grid;gap:10px}
.service-paper-option{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.service-paper-option:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.service-paper-option input{margin-top:3px;accent-color:var(--brand)}
.service-paper-option b{display:block}
.service-paper-option small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:760px){.service-form-grid,.service-preview{grid-template-columns:1fr}.service-field.full{grid-column:auto}.service-status-grid{grid-template-columns:1fr}}

/* ---------- tabel ---------- */
.tscroll{ overflow-x:auto; }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
.t th,.t td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
.t th{ position:sticky; top:0; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--surface-2); white-space:nowrap; }
.t td.num,.t th.num{ text-align:right; } .t tbody tr:hover{ background:color-mix(in srgb,var(--brand) 5%,transparent); }
.t tr.sel{ background:var(--brand-soft) !important; }
.t .cbx{ width:42px; text-align:center; }
.t td small{ display:block; color:var(--muted); font-size:12px; }
.t tfoot td{ font-weight:700; background:var(--surface-2); }
.empty{ padding:36px 16px; text-align:center; color:var(--muted); } .empty strong{ display:block; margin-bottom:4px; color:var(--ink); }
.badge{ display:inline-block; padding:1px 9px; font-size:12px; font-weight:700; border-radius:999px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); }
.badge.ok{ color:var(--ok); background:var(--ok-bg); border-color:transparent; } .badge.warn{ color:var(--warn); background:var(--warn-bg); border-color:transparent; }
.badge.danger{ color:var(--danger); background:var(--danger-bg); border-color:transparent; } .badge.brand{ color:var(--brand); background:var(--brand-soft); border-color:transparent; }
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
.toolbar input[type=search]{ flex:1; min-width:180px; max-width:340px; } .toolbar select{ width:auto; }
.selbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 16px; color:var(--brand); background:var(--brand-soft); border-bottom:1px solid var(--line); font-weight:600; }
.stars{ color:#e0a100; letter-spacing:1px; white-space:nowrap; } .stars .off{ color:var(--line); }

/* ---------- modal & toast ---------- */
.modal{ position:fixed; z-index:100; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:5vh 12px 12px; overflow-y:auto; background:rgba(8,14,26,.55); }
.modal-card{ width:min(520px,100%); background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.modal-card.wide{ width:min(860px,100%); } .modal-card.xl{ width:min(900px,100%); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
.modal-head h2{ font-size:18px; } .modal-x{ width:34px; height:34px; font-size:20px; line-height:1; color:var(--muted); background:none; border:0; border-radius:8px; } .modal-x:hover{ background:var(--surface-2); }
.modal-body{ padding:18px; } .modal-foot{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:12px 18px; background:var(--surface-2); border-top:1px solid var(--line); }
.toasts{ position:fixed; z-index:300; right:14px; top:calc(70px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
.toast{ max-width:min(380px,92vw); padding:11px 16px; color:#fff; background:#1b2436; border-radius:10px; box-shadow:var(--shadow); font-size:14px; animation:tin .18s ease-out; }
.toast.err{ background:#b3261e; } .toast.ok{ background:#146c38; }
@keyframes tin{ from{ transform:translateY(-8px); opacity:0; } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

.seg{ display:inline-flex; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; }
.seg button{ min-height:34px; padding:0 16px; font-weight:600; color:var(--muted); background:none; border:0; border-radius:7px; }
.seg button[aria-pressed=true]{ color:var(--ink); background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.rolepick{ display:grid; gap:8px; }
.rolepick label{ display:flex; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
.rolepick label:has(input:checked){ border-color:var(--brand); background:var(--brand-soft); }
.rolepick b{ display:block; } .rolepick small{ color:var(--muted); }
.starpick{ display:flex; gap:4px; } .starpick button{ width:38px; height:38px; font-size:22px; color:var(--line); background:none; border:1px solid var(--line); border-radius:8px; } .starpick button.on{ color:#e0a100; border-color:#e0a100; background:color-mix(in srgb,#e0a100 12%,transparent); }
.logo-box{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:12px; background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; }
.logo-box img{ max-width:200px; max-height:70px; object-fit:contain; background:#fff; padding:4px; border-radius:6px; }

/* ---------- KASIR ---------- */
.kasir{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(360px,42%) minmax(0,1fr); gap:12px; padding:12px; }

 * kripto lewat objek "platform" (lihat Code.gs). Karena itu file yang sama juga
 * dipakai oleh demo di browser.
 */

var APP_VERSION = '1.0.0';
var TZ_HOURS = 7;            // WIB (UTC+7)
var SESSION_HOURS = 12;      // masa berlaku login
var METHODS = ['cash', 'transfer', 'debit', 'credit', 'qris'];
var ROLES = ['admin', 'kasir']; // admin = "Kasir Admin", kasir = "Kasir" biasa

// Skema tabel. Tipe kolom: n = angka, s = teks, b = ya/tidak (disimpan 1/0)
var SCHEMA = {
  Users: [['id','n'],['username','s'],['salt','s'],['pass_hash','s'],['full_name','s'],['role','s'],['active','b'],['last_login','s'],['created_at','s']],
  Categories: [['id','n'],['name','s']],
  Products: [['id','n'],['type','s'],['category','s'],['sku','s'],['barcode','s'],['name','s'],['unit','s'],['cost_price','n'],['price','n'],['stock','n'],['min_stock','n'],['track_stock','b'],['created_at','s']],
  Customers: [['id','n'],['name','s'],['phone','s'],['email','s'],['address','s'],['created_at','s']],
  Transactions: [['id','n'],['invoice_no','s'],['date','s'],['user_id','n'],['user_name','s'],['customer_id','n'],['customer_name','s'],['customer_addr','s'],['subtotal','n'],['discount_type','s'],['discount_value','n'],['discount_amount','n'],['tax_rate','n'],['tax_amount','n'],['grand_total','n'],['method','s'],['amount_paid','n'],['change','n'],['status','s'],['note','s']],
  TxItems: [['id','n'],['tx_id','n'],['invoice_no','s'],['date','s'],['user_id','n'],['product_id','n'],['name','s'],['type','s'],['qty','n'],['price','n'],['cost','n'],['subtotal','n']],
  Evaluations: [['id','n'],['user_id','n'],['from','s'],['to','s'],['rating','n'],['bonus','n'],['note','s'],['updated_at','s'],['updated_by','s']],
  StockLog: [['id','n'],['date','s'],['product_id','n'],['name','s'],['user_name','s'],['type','s'],['change','n'],['before','n'],['after','n'],['note','s']],
  Settings: [['key','s'],['value','s']],
  Services: [['id','n'],['service_no','s'],['date_in','s'],['date_out','s'],['customer_name','s'],['phone','s'],['item_name','s'],['item_color','s'],['completeness','s'],['problem','s'],['status','s'],['received_by','n'],['received_by_name','s'],['picked_up_at','s'],['note','s']],
  // Penawaran harga. Daftar barang/jasa disimpan sebagai teks JSON di kolom "items"
  // (satu baris per penawaran) supaya simpan/sinkron offline cukup satu baris saja.
  Quotes: [['id','n'],['quote_no','s'],['date','s'],['valid_days','n'],['valid_until','s'],['customer_name','s'],['customer_phone','s'],['customer_addr','s'],['items','s'],['subtotal','n'],['discount_type','s'],['discount_value','n'],['discount_amount','n'],['tax_rate','n'],['tax_amount','n'],['grand_total','n'],['note','s'],['user_id','n'],['user_name','s'],['created_at','s'],['updated_at','s']]
};

var SETTING_DEFAULTS = {
  store_name: 'HDT POS', store_address: '', store_phone: '', store_email: '', tax_no: '',
  bank_name: '', bank_account: '', bank_holder: '',
  tax_rate: '0', paper_width: '80', receipt_footer: 'Terima kasih atas kunjungan Anda.',
  show_logo_on_receipt: '1', auto_print: '0', inv_code: '200', inv_year: '', inv_next: '1'
};

/* ---------------- util tanggal & angka ---------------- */
function pad_(n, w) { var s = String(n); while (s.length < w) { s = '0' + s; } return s; }
function wib_(d) {
  var t = new Date(d.getTime() + TZ_HOURS * 3600000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), h: t.getUTCHours(), i: t.getUTCMinutes(), s: t.getUTCSeconds() };
}
function ymd_(p) { return p.y + '-' + pad_(p.m, 2) + '-' + pad_(p.d, 2); }
function fmtDate_(d) { return ymd_(wib_(d)); }
function fmtDateTime_(d) { var p = wib_(d); return ymd_(p) + ' ' + pad_(p.h, 2) + ':' + pad_(p.i, 2) + ':' + pad_(p.s, 2); }
function isYmd_(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function addDays_(s, n) {
  var a = s.split('-');
  var t = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2] + n));
  return t.getUTCFullYear() + '-' + pad_(t.getUTCMonth() + 1, 2) + '-' + pad_(t.getUTCDate(), 2);
}
function diffDays_(a, b) { // b - a (hari)
  var x = a.split('-'), y = b.split('-');
  return Math.round((Date.UTC(+y[0], +y[1] - 1, +y[2]) - Date.UTC(+x[0], +x[1] - 1, +x[2])) / 86400000);
}
function round0_(v) { return Math.round(v); }
function round2_(v) { return Math.round(v * 100) / 100; }

/* ================================================================ */
function createBackend_(P) {
  var db = P.db;

  function fail(msg, code) { var e = new Error(msg); e.isApp = true; e.code = code || 'ERR'; throw e; }

  /* ---------- validasi ---------- */
  function str(v, max, label, required) {
    var s = (v === null || v === undefined) ? '' : String(v).replace(/\r/g, '').replace(/[\u0000-\u0009\u000b-\u001f]/g, ' ').trim();
    if (required && !s) { fail(label + ' wajib diisi.'); }
    if (s.length > max) { fail(label + ' terlalu panjang (maksimal ' + max + ' karakter).'); }
    return s;
  }
  function num(v, label, min, max) {
    var n = Number(v);
    if (v === '' || v === null || v === undefined || !isFinite(n)) { fail(label + ' harus berupa angka.'); }
    if (n < min) { fail(label + ' tidak boleh kurang dari ' + min + '.'); }
    if (n > max) { fail(label + ' terlalu besar.'); }
    return n;
  }
  function int(v, label, min, max) {
    var n = num(v, label, min, max);
    if (Math.floor(n) !== n) { fail(label + ' harus bilangan bulat.'); }
    return n;
  }
  function idList(v) {
    if (!Array.isArray(v) || !v.length) { fail('Tidak ada data yang dipilih.'); }
    if (v.length > 1000) { fail('Terlalu banyak data dipilih sekaligus (maksimal 1000).'); }
    return v.map(function (x) { return refId(x, 'ID'); });
  }
  // ID rujukan ke baris lain (mis. product_id, customer_id, atau id baris yang diedit/dihapus).
  // Server SELALU memberi id positif, tapi mesin offline (PWA) sementara memberi id NEGATIF
  // untuk baris yang baru dibuat di perangkat & belum tersinkron -- supaya kasir/produk/dst
  // tetap bisa dipakai (dan saling berelasi) sepenuhnya offline sebelum ada koneksi internet.
  // Karena itu rentang di sini sengaja mencakup negatif; server sendiri tidak pernah menerima
  // id negatif sungguhan karena mesin offline menuliskan ulang semua id sementara ini menjadi
  // id asli dari server sesaat setelah tersinkron (lihat rewriteRefs_ di engine.js).
  function refId(v, label) {
    var n = int(v, label, -1e12, 1e12);
    if (n === 0) { fail(label + ' tidak valid.'); }
    return n;
  }

  /* ---------- kripto ---------- */
  function hashPw(salt, pw) {
    var h = pw;
    for (var i = 0; i < 100; i++) { h = P.sha256(salt + ':' + h + ':' + pw); }
    return h;
  }
  function newSalt() { return P.sha256(P.secret() + ':' + Math.random() + ':' + new Date().getTime()).slice(0, 24); }
  function sign(msg) { var s = P.secret(); return P.sha256(s + ':' + P.sha256(s + ':' + msg)).slice(0, 40); }
  function makeToken(u) {
    var exp = Math.floor(P.now().getTime() / 1000) + SESSION_HOURS * 3600;
    var body = u.id + '.' + exp + '.' + u.pass_hash.slice(0, 8);
    return body + '.' + sign(body);
  }
  function authUser(token, roles) {
    var t = String(token || '').split('.');
    if (t.length !== 4) { fail('Sesi berakhir. Silakan masuk kembali.', 'AUTH'); }
    var body = t[0] + '.' + t[1] + '.' + t[2];
    if (sign(body) !== t[3]) { fail('Sesi tidak valid. Silakan masuk kembali.', 'AUTH'); }
    if (Number(t[1]) < Math.floor(P.now().getTime() / 1000)) { fail('Sesi berakhir. Silakan masuk kembali.', 'AUTH'); }
    var u = db.all('Users').filter(function (x) { return x.id === Number(t[0]); })[0];
    if (!u || !u.active || u.pass_hash.slice(0, 8) !== t[2]) { fail('Sesi tidak valid. Silakan masuk kembali.', 'AUTH'); }
    if (roles && roles.indexOf(u.role) < 0) { fail('Anda tidak memiliki hak akses untuk fitur ini.', 'FORBIDDEN'); }
    return u;
  }

  /* ---------- pengaturan ---------- */
  function currentYY() { return pad_(wib_(P.now()).y % 100, 2); }
  function loadSettings() {
    var kv = db.kv(), s = {}, k;
    for (k in SETTING_DEFAULTS) { s[k] = Object.prototype.hasOwnProperty.call(kv, k) ? kv[k] : SETTING_DEFAULTS[k]; }
    var parts = [], i = 0;
    while (kv['store_logo_' + i] !== undefined && kv['store_logo_' + i] !== '') { parts.push(kv['store_logo_' + i]); i++; }
    var yy = currentYY();
    var qrisReady = kv['qris_image_0'] !== undefined && kv['qris_image_0'] !== '';
    var next = (kv.inv_year === yy) ? (Number(kv.inv_next) || 1) : 1;
    return {
      store_name: s.store_name, store_address: s.store_address, store_phone: s.store_phone, store_email: s.store_email,
      tax_no: s.tax_no, bank_name: s.bank_name, bank_account: s.bank_account, bank_holder: s.bank_holder,
      tax_rate: Number(s.tax_rate) || 0, paper_width: Number(s.paper_width) === 58 ? 58 : 80,
      receipt_footer: s.receipt_footer, show_logo_on_receipt: s.show_logo_on_receipt === '1',
      auto_print: s.auto_print === '1', inv_code: s.inv_code || '200', inv_next: next, inv_yy: yy,
      inv_preview: yy + '-' + (s.inv_code || '200') + '-' + pad_(next, 6),
      store_logo: parts.join(''), qris_ready: qrisReady
    };
  }
  function invoiceEligible(t) {
    return t.customer_id > 0 && (t.method === 'cash' || t.method === 'transfer') && t.status === 'completed';
  }
  /* Kode pengaman cap QR invoice. Dibuat dari kunci rahasia server, jadi tidak bisa ditebak
     dari nomor invoice. Perangkat offline (P.noVerify) tidak punya kunci itu -> tidak membuat kode. */
  function verifyCode(t) { return P.noVerify ? '' : sign('verify:' + t.id + ':' + t.invoice_no).slice(0, 16); }
  function quoteVerifyCode(x) { return P.noVerify ? '' : sign('verifyq:' + x.id + ':' + x.quote_no).slice(0, 16); }

  /* ---------- bentuk data keluar ---------- */
  function pubUser(u) { return { id: u.id, username: u.username, full_name: u.full_name, role: u.role }; }
  function pubProduct(p, withCost) {
    var o = { id: p.id, type: p.type, category: p.category, sku: p.sku, barcode: p.barcode, name: p.name, unit: p.unit,
              price: p.price, stock: p.stock, min_stock: p.min_stock, track_stock: p.track_stock };
    if (withCost) { o.cost_price = p.cost_price; }
    return o;
  }
  function pubCustomer(c) { return { id: c.id, name: c.name, phone: c.phone, email: c.email, address: c.address }; }
  function txPayload(t, items) {
    return {
      id: t.id, invoice_no: t.invoice_no, date: t.date, user_id: t.user_id, cashier: t.user_name,
      customer_id: t.customer_id, customer: t.customer_name, customer_addr: t.customer_addr,
      items: items.map(function (i) { return { product_id: i.product_id, name: i.name, type: i.type, qty: i.qty, price: i.price, subtotal: i.subtotal }; }),
      subtotal: t.subtotal, discount_type: t.discount_type, discount_value: t.discount_value, discount_amount: t.discount_amount,
      tax_rate: t.tax_rate, tax_amount: t.tax_amount, grand_total: t.grand_total, method: t.method,
      amount_paid: t.amount_paid, change: t.change, status: t.status, note: t.note, invoice_eligible: invoiceEligible(t)
    };
  }
  function txSummary(t) {
    return { id: t.id, invoice_no: t.invoice_no, date: t.date, user_id: t.user_id, cashier: t.user_name, customer: t.customer_name,
             method: t.method, grand_total: t.grand_total, status: t.status, invoice_eligible: invoiceEligible(t) };
  }

  /* ---------- hitung total (dipakai checkout & data contoh) ---------- */
  function computeTotals(subtotal, discType, discValue, taxRate) {
    var disc = 0;
    if (discType === 'percent') { disc = round0_(subtotal * discValue / 100); }
    else if (discType === 'amount') { disc = round0_(discValue); }
    disc = Math.min(disc, subtotal);
    var taxable = subtotal - disc;
    var tax = round0_(taxable * taxRate / 100);
    return { discount: disc, tax: tax, grand: taxable + tax };
  }
  function invoiceNo(yy, code, seq) { return yy + '-' + code + '-' + pad_(seq, 6); }

  /* ================================================================
     AKSI
     ================================================================ */
  var A = {};

  /* ----- publik ----- */
  A.publicInfo = { auth: false, run: function () {
    var s = loadSettings();
    return { store_name: s.store_name, store_logo: s.store_logo, version: APP_VERSION };
  } };

  A.login = { auth: false, write: true, run: function (p) {
    var uname = str(p.username, 50, 'Username', true).toLowerCase();
    var pw = String(p.password || '');
    var key = 'fail:' + uname;
    var fails = Number(P.cacheGet(key) || 0);
    if (fails >= 5) { fail('Terlalu banyak percobaan gagal. Coba lagi dalam 10 menit.', 'LOCK'); }
    var u = db.all('Users').filter(function (x) { return x.username.toLowerCase() === uname; })[0];
    if (!u || !u.active || hashPw(u.salt, pw) !== u.pass_hash) {
      P.cachePut(key, String(fails + 1), 600);
      fail('Username atau password salah.', 'LOGIN');
    }
    P.cachePut(key, '0', 1);
    db.update('Users', u.id, { last_login: fmtDateTime_(P.now()) });
    return { token: makeToken(u), user: pubUser(u), default_password: u.username === 'admin' && hashPw(u.salt, 'admin123') === u.pass_hash };
  } };

  /* ----- semua user yang login ----- */
  A.bootstrap = { roles: ['admin', 'kasir'], run: function (p, user) {
    return {
      user: pubUser(user),
      settings: loadSettings(),
      products: db.all('Products').map(function (p) { return pubProduct(p, false); }),
      categories: db.all('Categories').map(function (c) { return c.name; }),
      customers: db.all('Customers').map(pubCustomer)
    };
  } };

  A.checkout = { roles: ['admin', 'kasir'], write: true, run: function (p, user) {
    var raw = p.items;
    if (!Array.isArray(raw) || !raw.length) { fail('Keranjang masih kosong.'); }
    if (raw.length > 200) { fail('Terlalu banyak item dalam satu transaksi (maksimal 200).'); }
    var qtyById = {}, order = [];
    raw.forEach(function (it) {
      var pid = refId(it && it.product_id, 'Produk');
      var q = int(it && it.qty, 'Jumlah', 1, 999999);
      if (!qtyById[pid]) { qtyById[pid] = 0; order.push(pid); }
      qtyById[pid] += q;
    });

    var customer = null;
    if (p.customer_id) {
      var cid = refId(p.customer_id, 'Pelanggan');
      customer = db.all('Customers').filter(function (c) { return c.id === cid; })[0];
      if (!customer) { fail('Pelanggan tidak ditemukan (mungkin sudah dihapus).'); }
    }
    var discType = p.discount_type || 'none';
    if (['none', 'percent', 'amount'].indexOf(discType) < 0) { fail('Jenis diskon tidak valid.'); }
    var discValue = 0;
    if (discType !== 'none') {
      discValue = num(p.discount_value || 0, 'Diskon', 0, 1e12);
      if (discType === 'percent' && discValue > 100) { fail('Diskon persen tidak boleh lebih dari 100.'); }
      if (discValue === 0) { discType = 'none'; }
    }
    var method = String(p.payment_method || '');
    if (METHODS.indexOf(method) < 0) { fail('Metode pembayaran tidak valid.'); }
    var note = str(p.note, 200, 'Catatan', false);

    var settings = loadSettings();
    var products = db.all('Products');
    var byId = {};
    products.forEach(function (x) { byId[x.id] = x; });

    var lines = [], subtotal = 0;
    order.forEach(function (pid) {
      var pr = byId[pid], q = qtyById[pid];
      if (!pr) { fail('Ada produk yang sudah dihapus. Muat ulang halaman kasir.'); }
      if (pr.track_stock && pr.stock < q) { fail('Stok "' + pr.name + '" tidak cukup (tersisa ' + pr.stock + ', diminta ' + q + ').'); }
      var sub = round2_(pr.price * q);
      subtotal += sub;
      lines.push({ pr: pr, qty: q, subtotal: sub });
    });
    subtotal = round2_(subtotal);
    var tot = computeTotals(subtotal, discType, discValue, settings.tax_rate);
    var paid = tot.grand, change = 0;
    if (method === 'cash') {
      paid = num(p.amount_paid || 0, 'Uang diterima', 0, 1e13);
      if (paid + 0.0001 < tot.grand) { fail('Uang yang diterima kurang dari total belanja.'); }
      change = round2_(paid - tot.grand);
    }

    // nomor invoice otomatis: YY-KODE-URUT6, urutan mulai 1 tiap tahun
    var now = P.now(), yy = currentYY();
    var kv = db.kv();
    var seq = (kv.inv_year === yy) ? (Number(kv.inv_next) || 1) : 1;
    var no = invoiceNo(yy, settings.inv_code, seq);

    var tx = db.insert('Transactions', {
      invoice_no: no, date: fmtDateTime_(now), user_id: user.id, user_name: user.full_name,
      customer_id: customer ? customer.id : 0, customer_name: customer ? customer.name : '', customer_addr: customer ? customer.address : '',
      subtotal: subtotal, discount_type: discType, discount_value: discValue, discount_amount: tot.discount,
      tax_rate: settings.tax_rate, tax_amount: tot.tax, grand_total: tot.grand,
      method: method, amount_paid: paid, change: change, status: 'completed', note: note
    });
    var itemRows = lines.map(function (l) {
      return { tx_id: tx.id, invoice_no: no, date: tx.date, user_id: user.id, product_id: l.pr.id, name: l.pr.name, type: l.pr.type,
               qty: l.qty, price: l.pr.price, cost: l.pr.cost_price, subtotal: l.subtotal };
    });
    var saved = db.insertMany('TxItems', itemRows);
    lines.forEach(function (l) {
      if (l.pr.track_stock) { db.update('Products', l.pr.id, { stock: l.pr.stock - l.qty }); }
    });
    db.kvWrite({ inv_year: yy, inv_next: String(seq + 1) }, []);
    return txPayload(tx, saved);
  } };

  A.txList = { roles: ['admin', 'kasir'], run: function (p, user) {
    var today = fmtDate_(P.now());
    var from = isYmd_(p.from) ? p.from : today, to = isYmd_(p.to) ? p.to : today;
    if (to < from) { var t0 = from; from = to; to = t0; }
    var q = String(p.q || '').toLowerCase().trim();
    var uid = user.role === 'admin' ? Number(p.user_id || 0) : user.id;
    var rows = db.all('Transactions').filter(function (t) {
      var d = t.date.slice(0, 10);
      if (d < from || d > to) { return false; }
      if (uid && t.user_id !== uid) { return false; }
      if (q && (t.invoice_no + ' ' + t.customer_name + ' ' + t.user_name).toLowerCase().indexOf(q) < 0) { return false; }
      return true;
    });
    rows.sort(function (a, b) { return b.id - a.id; });
    var total = rows.length;
    return { total: total, from: from, to: to, rows: rows.slice(0, 300).map(txSummary) };
  } };

  function loadTx(id, user) {
    id = refId(id, 'Transaksi');
    var t = db.all('Transactions').filter(function (x) { return x.id === id; })[0];
    if (!t) { fail('Transaksi tidak ditemukan.'); }
    if (user.role !== 'admin' && t.user_id !== user.id) { fail('Anda hanya dapat melihat transaksi milik sendiri.', 'FORBIDDEN'); }
    var items = db.all('TxItems').filter(function (i) { return i.tx_id === t.id; });
    return txPayload(t, items);
  }
  A.txGet = { roles: ['admin', 'kasir'], run: function (p, user) { return loadTx(p.id, user); } };
  A.invoiceGet = { roles: ['admin', 'kasir'], run: function (p, user) {
    var t = loadTx(p.id, user);
    if (!t.invoice_eligible) { fail('Invoice hanya untuk pelanggan terdaftar dengan pembayaran tunai atau transfer.'); }
    var c = db.all('Customers').filter(function (x) { return x.id === t.customer_id; })[0];
    if (c) { t.customer = c.name; t.customer_addr = c.address; }
    t.verify_code = verifyCode(t);
    return t;
  } };
  /* Verifikasi cap QR invoice -- PUBLIK (tanpa login): dipanggil halaman yang terbuka saat
     pelanggan scan QR di invoice. Hanya mengembalikan SATU invoice, dan hanya bila kode
     pengamannya cocok; alamat pelanggan tidak ikut dikirim. */
  A.invoiceVerify = { auth: false, run: function (p) {
    var no = String(p.no || '').trim().slice(0, 40), code = String(p.code || '').trim().toLowerCase().slice(0, 40);
    var t = (no && code && !P.noVerify) ? db.all('Transactions').filter(function (x) { return x.invoice_no === no && verifyCode(x) === code; })[0] : null;
    if (!t) { fail('Invoice tidak ditemukan atau kode verifikasi tidak cocok.', 'NOTFOUND'); }
    var s = loadSettings();
    var c = t.customer_id > 0 ? db.all('Customers').filter(function (x) { return x.id === t.customer_id; })[0] : null;
    return {
      store_name: s.store_name, store_phone: s.store_phone,
      invoice_no: t.invoice_no, date: t.date, customer: c ? c.name : t.customer_name, cashier: t.user_name,
      method: t.method, status: t.status,
      items: db.all('TxItems').filter(function (i) { return i.tx_id === t.id; }).map(function (i) { return { name: i.name, qty: i.qty, price: i.price, subtotal: i.subtotal }; }),
      subtotal: t.subtotal, discount_amount: t.discount_amount, tax_rate: t.tax_rate, tax_amount: t.tax_amount, grand_total: t.grand_total
    };
  } };

  /* ----- service / reparasi ----- */

  }

  }

  }

   server + antrean sinkronisasi). File Core.gs di atas ini TIDAK diubah

/* ---------- sha256 murni-JS (dipakai untuk hash sesi/kata sandi secara lokal) ---------- */

/* ---------- "database" lokal di memori, dicadangkan ke IndexedDB ---------- */
function localDb_(state, onChange) {
  function coerce(t, o) {
    var out = {};
    SCHEMA[t].forEach(function (c) {
      var v = o[c[0]];
      if (c[1] === 'n') { v = (v === '' || v === null || v === undefined) ? 0 : (Number(v) || 0); }
      else if (c[1] === 'b') { v = (v === true || v === 1 || v === '1'); }
      else { v = (v === null || v === undefined) ? '' : String(v); }
      out[c[0]] = v;
    });
    return out;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function nextLocalId(t) {
    // ID sementara: negatif, supaya tidak akan pernah bentrok dengan ID asli dari
    // server (server selalu memberi ID positif berurutan).
    var min = 0;
    state.tables[t].forEach(function (r) { if (r.id < min) { min = r.id; } });
    return min - 1;
  }
  return {
    all: function (t) { return state.tables[t].map(clone); },
    insert: function (t, o) {
      var rows = state.tables[t];
      var row = coerce(t, Object.assign({}, o, { id: nextLocalId(t) }));
      rows.push(row); onChange(); return clone(row);
    },
    insertMany: function (t, arr) {
      var rows = state.tables[t], out = [];
      arr.forEach(function (o) { var row = coerce(t, Object.assign({}, o, { id: nextLocalId(t) })); rows.push(row); out.push(clone(row)); });
      onChange(); return out;
    },
    update: function (t, id, patch) {
      var row = state.tables[t].filter(function (r) { return r.id === id; })[0];
      if (!row) { return null; }
      var merged = coerce(t, Object.assign({}, row, patch, { id: id }));
      Object.keys(merged).forEach(function (k) { row[k] = merged[k]; });
      onChange(); return clone(row);
    },
    removeMany: function (t, ids) {
      var before = state.tables[t].length;
      state.tables[t] = state.tables[t].filter(function (r) { return ids.indexOf(r.id) < 0; });
      onChange(); return before - state.tables[t].length;
    },
    kv: function () { return clone(state.kv); },
    kvWrite: function (set, del) {
      Object.keys(set).forEach(function (k) { state.kv[k] = String(set[k]); });
      (del || []).forEach(function (k) { delete state.kv[k]; });
      onChange();
    },
    /* ---- dipakai khusus mesin sinkronisasi, bukan bagian dari logika Core.gs ---- */
    replaceRow: function (t, oldId, serverPartial) {
      var rows = state.tables[t], i = rows.findIndex(function (r) { return r.id === oldId; });
      var base = i >= 0 ? rows[i] : {};

      if (i >= 0) { rows[i] = merged; } else { rows.push(merged); }
      onChange(); return clone(merged);
    },
    removeWhere: function (t, pred) {
      state.tables[t] = state.tables[t].filter(function (r) { return !pred(r); });
      onChange();
    },
    insertRaw: function (t, o) {
      var row = coerce(t, o); state.tables[t].push(row); onChange(); return clone(row);
    },
    replaceAll: function (t, arr) {
      state.tables[t] = (arr || []).map(function (o) { return coerce(t, o); });
      onChange();
    },
    mergeWindow: function (t, arr, keyField, allowedIds) {
      // Timpa baris di dalam jendela (misalnya transaksi 180 hari terakhir) dengan versi
      // server, tapi JANGAN buang riwayat lokal yang lebih lama dari jendela tersebut.
      var incoming = (arr || []).map(function (o) { return coerce(t, o); });
      var incomingIds = {}; incoming.forEach(function (r) { incomingIds[r.id] = 1; });
      var kept = state.tables[t].filter(function (r) {
        if (r.id < 0) { return true; } // punya kandidat lokal yang belum tersinkron -> pertahankan
        if (allowedIds && keyField) { return allowedIds.indexOf(r[keyField]) < 0; }
        return !incomingIds[r.id];
      });
      state.tables[t] = kept.concat(incoming);
      onChange();
    }
  };
}

/* ---------- penyimpanan IndexedDB (satu blob JSON per perangkat) ---------- */
var IDB_NAME = 'hdtpos_offline_v1', IDB_STORE = 'kv';
function idbOpen_() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbGet_(key) {
  return idbOpen_().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(IDB_STORE, 'readonly');
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  });
}
function idbSet_(key, value) {
  return idbOpen_().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}

/* ---------- alamat Web App (Google Apps Script) ---------- */
function getWebAppUrl() { try { return localStorage.getItem('hdt_webapp_url') || ''; } catch (e) { return ''; } }
function setWebAppUrl(u) { try { localStorage.setItem('hdt_webapp_url', u || ''); } catch (e) {} }

/* ---------- state global mesin offline ---------- */
var OFF = null;                 // { state, db, backend }
var offlineReady = false;
var saveTimer_ = null;
var syncing_ = false;
var needRelogin_ = false;
var lastSyncError_ = null;
var lastPullAt_ = 0;
var lastReadFallback_ = null;    // { action, error } bila baca terakhir terpaksa memakai data perangkat

function scheduleSave_() {
  if (saveTimer_) { return; }
  saveTimer_ = setTimeout(function () {
    saveTimer_ = null;
    idbSet_('state', OFF.state).catch(function () {});
  }, 250);
}
function flushSaveNow_() {
  // Simpan segera (tanpa menunggu debounce 250ms) -- dipanggil saat halaman akan
  // ditutup/disembunyikan supaya perubahan offline terakhir tidak sempat hilang.
  if (saveTimer_) { clearTimeout(saveTimer_); saveTimer_ = null; }
  if (OFF && OFF.state) { idbSet_('state', OFF.state).catch(function () {}); }
}
if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { flushSaveNow_(); } });
  window.addEventListener('pagehide', flushSaveNow_);
}

async function initOffline() {
  var state = null;
  try { state = await idbGet_('state'); } catch (e) {}
  if (!state || state.v !== 1) {
    var tables = {};
    Object.keys(SCHEMA).forEach(function (k) { if (k !== 'Settings') { tables[k] = []; } });
    state = { v: 1, secret: sha256Hex_('device' + Math.random() + Date.now()), tables: tables, kv: {}, outbox: [] };
  }
  if (!state.outbox) { state.outbox = []; }
  // Perangkat yang datanya tersimpan sebelum ada tabel baru (mis. Quotes) belum punya
  // wadahnya -- tambahkan tabel yang belum ada tanpa menyentuh data yang sudah tersimpan.
  Object.keys(SCHEMA).forEach(function (k) { if (k !== 'Settings' && !Array.isArray(state.tables[k])) { state.tables[k] = []; } });
  if (!state.secret) { state.secret = sha256Hex_('device' + Math.random() + Date.now()); }
  var ldb = localDb_(state, scheduleSave_);
  var platform = {
    db: ldb, sha256: sha256Hex_, now: function () { return new Date(); }, lock: function (fn) { return fn(); },
    secret: function () { return state.secret; }, cacheGet: function () { return null; }, cachePut: function () {}, log: function (e) { console.error(e); }
  };
  OFF = { state: state, db: ldb, backend: createBackend_(platform) };
  offlineReady = true;
}

/* ---------- panggilan ke server (fetch, bukan google.script.run) ---------- */
async function serverCall(action, token, payload, timeoutMs) {
  var url = getWebAppUrl();
  if (!url) { var e = new Error('Alamat Web App belum diatur.'); e.code = 'NOURL'; throw e; }
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 12000) : null;
  try {
    var res = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'api=1', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari preflight CORS (Apps Script tak bisa menjawabnya)
      body: JSON.stringify({ action: action, token: token || '', payload: payload || {} }),
      signal: ctrl ? ctrl.signal : undefined
    });
    return await res.json();
  } finally { if (timer) { clearTimeout(timer); } }
}

/* ---------- klasifikasi aksi: tabel target + cara antre saat offline ---------- */
var WRITE_ACTIONS = { checkout: 1, serviceSave: 1, productSave: 1, productDelete: 1, productStock: 1, customerSave: 1, customerDelete: 1, userSave: 1, userDelete: 1, passwordChange: 1, settingsSave: 1, evalSave: 1, quoteSave: 1, quoteDelete: 1 };
var ACTION_TABLE = { serviceSave: 'Services', productSave: 'Products', productDelete: 'Products', productStock: 'Products', customerSave: 'Customers', customerDelete: 'Customers', userSave: 'Users', userDelete: 'Users', checkout: 'Transactions', quoteSave: 'Quotes', quoteDelete: 'Quotes' };
var SAVE_ACTIONS = { serviceSave: 1, productSave: 1, customerSave: 1, userSave: 1, quoteSave: 1 };
var DELETE_ACTIONS = { productDelete: 1, customerDelete: 1, userDelete: 1, quoteDelete: 1 };
var FK_RULES = {
  quoteSave: [{ table: 'Quotes', kind: 'scalar', field: 'id' }],
  quoteDelete: [{ table: 'Quotes', kind: 'array', field: 'ids' }],
  checkout: [{ table: 'Customers', kind: 'scalar', field: 'customer_id' }, { table: 'Products', kind: 'arrayField', field: 'items', sub: 'product_id' }],
  productStock: [{ table: 'Products', kind: 'scalar', field: 'id' }],
  productDelete: [{ table: 'Products', kind: 'array', field: 'ids' }],
  customerDelete: [{ table: 'Customers', kind: 'array', field: 'ids' }],
  userDelete: [{ table: 'Users', kind: 'array', field: 'ids' }],
  evalSave: [{ table: 'Users', kind: 'scalar', field: 'user_id' }]

  var rules = FK_RULES[action]; if (!rules || !payload) { return; }
  rules.forEach(function (r) {
    if (r.table !== table) { return; }
    if (r.kind === 'scalar') { if (payload[r.field] === oldId) { payload[r.field] = newId; } }
    else if (r.kind === 'array') { var a = payload[r.field]; if (Array.isArray(a)) { for (var i = 0; i < a.length; i++) { if (a[i] === oldId) { a[i] = newId; } } } }

}

function uid_() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  return OFF.state.outbox.find(function (e) { return e.mode === 'create' && e.table === table && e.localId === localId; });
}
function cancelPendingCreate_(table, localId) {
  var i = OFF.state.outbox.findIndex(function (e) { return e.mode === 'create' && e.table === table && e.localId === localId; });

/** Penawaran yang tersimpan di perangkat (id negatif) tapi tidak ada lagi di antrean -- misalnya
 *  dulu ditolak server yang belum diperbarui -- dimasukkan lagi ke antrean supaya tetap terkirim. */
function requeueOrphanQuotes_() {
  (OFF.state.tables.Quotes || []).forEach(function (r) {
    if (r.id >= 0 || findPendingCreate_('Quotes', r.id)) { return; }
    var items = [];
    try { items = JSON.parse(r.items || '[]'); } catch (e) { items = []; }
    OFF.state.outbox.push({
      id: uid_(), action: 'quoteSave', table: 'Quotes', mode: 'create', localId: r.id, ts: new Date().toISOString(),
      payload: {
        id: 0, customer_name: r.customer_name, customer_phone: r.customer_phone, customer_addr: r.customer_addr,
        date: r.date, valid_days: r.valid_days,
        items: (Array.isArray(items) ? items : []).map(function (l) { return { name: l.name, qty: l.qty, price: l.price }; }),
        discount_type: r.discount_type || 'none', discount_value: r.discount_value, tax_rate: r.tax_rate, note: r.note
      }

}

/** Dipanggil setelah aksi tulis berhasil dijalankan secara LOKAL, untuk menentukan
 *  apakah & bagaimana perubahan ini perlu diantre menunggu koneksi internet. */
function afterLocalWrite_(action, payload, localResult) {
  if (!WRITE_ACTIONS[action]) { return; }
  var table = ACTION_TABLE[action];

  if (action === 'productStock' && isPendingId_(payload.id)) {
    var pend = findPendingCreate_('Products', payload.id);
    if (pend) { pend.payload.stock = localResult.stock; touchOutbox_(); return; }
  }
  if (SAVE_ACTIONS[action] && payload.id && isPendingId_(payload.id)) {
    var pend2 = findPendingCreate_(table, payload.id);
    if (pend2) { pend2.payload = Object.assign({}, payload, { id: 0 }); touchOutbox_(); return; }
  }
  if (DELETE_ACTIONS[action]) {
    var real = [];
    (payload.ids || []).forEach(function (id) {
      if (isPendingId_(id)) { cancelPendingCreate_(table, id); } else { real.push(id); }
    });
    if (!real.length) { touchOutbox_(); return; }
    payload = Object.assign({}, payload, { ids: real });
  }

  var isCreate = (SAVE_ACTIONS[action] && !payload.id) || action === 'checkout';
  OFF.state.outbox.push({
    id: uid_(), action: action, payload: payload, table: table,
    mode: isCreate ? 'create' : 'other', localId: isCreate ? localResult.id : null,
    ts: new Date().toISOString()

/* ---------- antrean -> server, saat online ---------- */
async function flushOutbox() {

  if (!navigator.onLine || !getWebAppUrl() || !S.token) { return; }

  requeueOrphanQuotes_();

  try {
    while (OFF.state.outbox.length) {
      var entry = OFF.state.outbox[0], res;
      try { res = await serverCall(entry.action, S.token, entry.payload, 15000); }
      catch (e) { lastSyncError_ = 'Jaringan terputus saat sinkronisasi.'; failed = true; break; }
      if (!res || res.ok !== true) {
        if (res && res.code === 'AUTH') { needRelogin_ = true; lastSyncError_ = 'Sesi berakhir, silakan masuk lagi untuk melanjutkan sinkronisasi.'; failed = true; break; }
        lastSyncError_ = (res && res.error) || 'Sinkronisasi ditolak server.';

        // Masalah di sisi server (versi server lama / "Aksi tidak dikenal", atau error database):
        // data ini sah, jadi JANGAN dibuang -- simpan untuk dicoba lagi nanti. Hanya entri yang
        // ditolak karena isinya tidak valid yang dibuang supaya tidak mengganjal selamanya.

    }
    if (deferred.length) { OFF.state.outbox = OFF.state.outbox.concat(deferred); touchOutbox_(); }
    // tarik data server bila antrean kosong, atau yang tersisa hanya penawaran (tarikan data
    // penawaran selalu mempertahankan penawaran lokal yang belum tersinkron)
    var onlyQuotesLeft = OFF.state.outbox.every(function (e) { return e.table === 'Quotes'; });

  if (entry.action === 'checkout') {
    OFF.db.removeWhere('Transactions', function (r) { return r.id === oldId; });
    OFF.db.removeWhere('TxItems', function (r) { return r.tx_id === oldId; });
    OFF.db.insertRaw('Transactions', {
      id: newId, invoice_no: serverData.invoice_no, date: serverData.date, user_id: serverData.user_id, user_name: serverData.cashier,
      customer_id: serverData.customer_id, customer_name: serverData.customer, customer_addr: serverData.customer_addr,
      subtotal: serverData.subtotal, discount_type: serverData.discount_type, discount_value: serverData.discount_value, discount_amount: serverData.discount_amount,
      tax_rate: serverData.tax_rate, tax_amount: serverData.tax_amount, grand_total: serverData.grand_total, method: serverData.method,
      amount_paid: serverData.amount_paid, change: serverData.change, status: serverData.status, note: serverData.note
    });
    (serverData.items || []).forEach(function (it) {
      OFF.db.insert('TxItems', { tx_id: newId, invoice_no: serverData.invoice_no, date: serverData.date, user_id: serverData.user_id, product_id: it.product_id, name: it.name, type: it.type, qty: it.qty, price: it.price, cost: 0, subtotal: it.subtotal });
    });

    // server mengembalikan items sebagai array; di tabel lokal disimpan sebagai teks JSON
    OFF.db.replaceRow(table, oldId, Object.assign({}, serverData, { items: JSON.stringify(serverData.items || []) }));
    if (typeof onQuoteSynced === 'function') { onQuoteSynced(oldId, serverData); }
  } else {
    OFF.db.replaceRow(table, oldId, serverData);

}

/* ---------- ambil data terbaru dari server ---------- */
async function pullFromServer(keepError) {
  if (!offlineReady || !navigator.onLine || !getWebAppUrl() || !S.token) { return; }
  var res;
  try { res = await serverCall('syncPull', S.token, { days: 180 }, 25000); }
  catch (e) { return; }
  if (!res || res.ok !== true) { if (res && res.code === 'AUTH') { needRelogin_ = true; } return; }
  var d = res.data;
  OFF.db.replaceAll('Users', d.users);
  OFF.db.replaceAll('Categories', d.categories);
  OFF.db.replaceAll('Products', d.products);
  OFF.db.replaceAll('Customers', d.customers);
  OFF.db.replaceAll('Services', d.services);
  if (Array.isArray(d.quotes)) {
    // pertahankan penawaran yang dibuat di perangkat ini & belum tersinkron (id negatif)
    OFF.db.replaceAll('Quotes', d.quotes.concat(OFF.db.all('Quotes').filter(function (r) { return r.id < 0; })));
  }
  if (d.evaluations) { OFF.db.replaceAll('Evaluations', d.evaluations); }

/* ---------- token ganda ----------

/* ---------- lencana status sinkronisasi (dipakai di topbar) ---------- */
function updateSyncBadge() {

/* ---------- transport dipakai oleh app.js (menggantikan google.script.run) ---------- */
async function api(action, payload) {
  progress(1);
  try {
    if (!offlineReady) { await initOffline(); }
    if (action === 'login') { return await handleLogin_(payload || {}); }
    var isWrite = !!WRITE_ACTIONS[action];

    if (isWrite) {
      var local = OFF.backend.handle(action, localToken_(), payload || {});
      if (!local.ok) {
        var e1 = new Error(local.error || 'Terjadi kesalahan.'); e1.code = local.code;
        if (local.code === 'AUTH') { authLost(local.error); }
        throw e1;
      }
      afterLocalWrite_(action, payload || {}, local.data);
      if (navigator.onLine) { flushOutbox().catch(function () {}); }

    // baca: kalau online, coba server dulu (data paling baru); kalau gagal karena apa pun
    // (offline, jaringan, atau token server tidak valid), pakai data lokal -- jangan
    // langsung mengeluarkan pengguna hanya karena server menolak, selama sesi lokal masih sah.

function withLocalPending_(action, payload, data) {
  if (action !== 'quoteList' || !data || !Array.isArray(data.rows)) { return data; }
  var loc = OFF.backend.handle('quoteList', localToken_(), payload || {});
  if (loc.ok) {
    var pend = loc.data.rows.filter(function (r) { return r.id < 0; });
    if (pend.length) { data.rows = pend.concat(data.rows); data.total += pend.length; }
  }
  return data;
}

<script>
'use strict';
/* =====================================================================
   HDT POS - antarmuka. Satu file ini berjalan di dua mode:
   - Google Apps Script : memanggil server lewat google.script.run
   - Demo               : memakai backend contoh di browser (window.HDT_DEMO)

/* ---------- helper ---------- */

const nf0 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }

/* ---------- state ---------- */
const S = {
  token: null, user: null, settings: {}, products: [], categories: [], customers: [], defaultPw: false,
  view: 'kasir', cart: [], customerId: 0, discType: 'percent', discValue: 0, cat: 'all', q: '', pane: 'catalog',
  paper: Number(store.get('hdt_paper')) === 58 ? 58 : 80,
  sel: { products: new Set(), customers: new Set(), users: new Set() }

/* ---------- transport ---------- */
// api() dan seluruh mesin offline (IndexedDB + antrean sinkronisasi) didefinisikan di
// blok <script> sebelum ini (lihat engine.js yang ditempel di atas). Di PWA ini TIDAK ada
// mode "GAS" (google.script.run) atau "mode demo" -- selalu lewat mesin offline yang
// membaca/menulis lokal lalu menyinkronkan ke Web App Google Apps Script saat online.
let pending = 0;
function progress(d) {
  pending = Math.max(0, pending + d);
  const b = $('#bar'); if (!b) return;
  if (pending > 0) { b.classList.remove('done'); b.classList.add('on'); }
  else { b.classList.remove('on'); b.classList.add('done'); setTimeout(() => { if (!pending) b.classList.remove('done'); }, 500); }
}
/** Jalankan aksi dengan tombol terkunci + tampilkan error sebagai toast. */
async function run(btn, fn) {
  if (btn) { if (btn.disabled) { return; } btn.disabled = true; }
  try { return await fn(); }
  catch (e) { if (e.code !== 'AUTH') { toast(e.message, 'err'); } }
  finally { if (btn) { btn.disabled = false; } }

/* ---------- toast & modal ---------- */

  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;

    '<div class="modal-head"><h2>' + esc(o.title) + '</h2><button type="button" class="modal-x" data-close aria-label="Tutup">×</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') + '</div>';

/* ---------- cetak (struk, invoice, laporan) ---------- */
function printDoc(html, pageCss) {
  const root = $('#printRoot');
  root.innerHTML = html;
  $('#pageStyle').textContent = '@page{' + pageCss + '}';
  const imgs = $$('img', root).filter(i => !i.complete).map(i => new Promise(r => { i.onload = i.onerror = r; }));
  Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 1500))]).then(() => {
    document.body.classList.add('printing');
    let closed = false, safety;
    const done = () => {
      if (closed) { return; }
      closed = true;
      clearTimeout(safety);
      document.body.classList.remove('printing'); root.innerHTML = '';
      window.removeEventListener('afterprint', done);
      window.removeEventListener('focus', onFocus);
    };
    const onFocus = () => setTimeout(done, 300);
    window.addEventListener('afterprint', done);
    window.addEventListener('focus', onFocus);
    // Jaring pengaman: di sebagian browser/iframe, "afterprint" atau fokus kembali
    // tidak selalu terpicu, sehingga tombol di balik layar cetak jadi tak terlihat/tidak
    // berfungsi. Batas waktu ini memastikan tampilan selalu kembali normal.
    safety = setTimeout(done, 6000);
    try { window.print(); }
    catch (e) { done(); toast('Browser memblokir cetak. Buka aplikasi di tab sendiri lalu coba lagi.', 'err'); }
  });
}

/* ---------- pangkas ruang kosong di sekeliling logo ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak dapat dibaca.')); i.src = src; }); }
/** Mengembalikan canvas hasil pangkas, atau null bila tidak ada yang perlu dipangkas. */
function trimCanvas(img) {
  const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
  const k = Math.min(1, 1600 / nw), w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const cs = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
  const clear = cs.every(i => d[i + 3] < 20);
  const bg = [0, 1, 2].map(j => cs.reduce((a, i) => a + d[i + j], 0) / 4);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = at(x, y); if (d[i + 3] < 20) { continue; }
      if (!clear && Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) < 60) { continue; }
      if (x < x0) { x0 = x; } if (x > x1) { x1 = x; } if (y < y0) { y0 = y; } if (y > y1) { y1 = y; }
    }
  }
  if (x1 < 0) { return null; }
  const m = Math.max(2, Math.round(Math.max(w, h) * .015));
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw * ch >= w * h * .92) { return null; }
  const out = document.createElement('canvas'); out.width = Math.round(cw / k); out.height = Math.round(ch / k);
  const og = out.getContext('2d'); og.drawImage(img, x0 / k, y0 / k, cw / k, ch / k, 0, 0, out.width, out.height);
  if (!clear && (bg[0] + bg[1] + bg[2]) / 3 >= 200) {   // latar terang polos (mis. JPG berlatar abu-abu muda): jadikan transparan agar menyatu dengan kertas
    const im = og.getImageData(0, 0, out.width, out.height), q = im.data;
    for (let i = 0; i < q.length; i += 4) {
      const dist = Math.abs(q[i] - bg[0]) + Math.abs(q[i + 1] - bg[1]) + Math.abs(q[i + 2] - bg[2]);
      if (dist < 45) { q[i + 3] = 0; } else if (dist < 120) { q[i + 3] = Math.round(255 * (dist - 45) / 75); }
    }
    og.putImageData(im, 0, 0); out._alpha = true;
  }
  return out;
}
/** Logo yang ruang kosong di tepinya sudah dipangkas (di-cache). Dipakai di menu, login, struk, invoice, laporan. */
const TRIM = {};
async function trimmedSrc(src) {
  if (!src) { return ''; }
  if (TRIM[src]) { return TRIM[src]; }
  let out = src;
  try { const c = trimCanvas(await loadImg(src)); if (c) { out = c.toDataURL(c._alpha || !/^data:image\/jpeg/.test(src) ? 'image/png' : 'image/jpeg', .92); } } catch (e) { /* pakai logo asli */ }
  TRIM[src] = out; return out;
}

function quoteTotals(q) {

  disc = Math.max(0, Math.min(disc, subtotal));
  const taxable = subtotal - disc, tax = Math.round(taxable * (Number(q.taxRate) || 0) / 100);
  return { subtotal, disc, tax, grand: taxable + tax };
}

function calcCart() {
  const sub = S.cart.reduce((a, l) => a + l.price * l.qty, 0);
  const v = Number(S.discValue) || 0;
  let disc = S.discType === 'percent' ? Math.round(sub * Math.min(v, 100) / 100) : Math.round(v);
  disc = Math.min(disc, sub);
  const tax = Math.round((sub - disc) * (ST().tax_rate || 0) / 100);
  return { sub, disc, tax, grand: sub - disc + tax };
}

function renderCatalog() {
  const bar = $('#catBar'), grid = $('#grid'); if (!bar || !grid) { return; }
  const cats = ['all'].concat(S.categories.filter(c => S.products.some(p => p.category === c)));
  if (S.products.some(p => !p.category)) { cats.push('__none'); }
  if (!cats.includes(S.cat)) { S.cat = 'all'; }
  bar.innerHTML = cats.map(c => '<button type="button" class="chip" aria-pressed="' + (S.cat === c) + '" data-act="cat" data-cat="' + esc(c) + '">' + (c === 'all' ? 'Semua' : c === '__none' ? 'Lainnya' : esc(c)) + '</button>').join('');
  const q = S.q.trim().toLowerCase();
  const list = S.products.filter(p => (S.cat === 'all' || (S.cat === '__none' ? !p.category : p.category === S.cat)) &&
    (!q || (p.name + ' ' + p.sku + ' ' + p.barcode).toLowerCase().includes(q)));
  grid.innerHTML = list.length ? list.map(p => {
    const out = p.track_stock && p.stock <= 0, low = p.track_stock && !out && p.stock <= p.min_stock;
    const st = p.type === 'jasa' ? '<span class="st">Jasa</span>' : !p.track_stock ? '<span class="st">' + esc(p.unit) + '</span>' : out ? '<span class="st out">Stok habis</span>' : '<span class="st' + (low ? ' low' : '') + '">' + (low ? 'Menipis · ' : 'Stok ') + int(p.stock) + ' ' + esc(p.unit) + '</span>';
    return '<button type="button" class="pcard" data-act="add" data-id="' + p.id + '"' + (out ? ' disabled' : '') + '><span class="nm">' + esc(p.name) + '</span>' + st + '<span class="pr">' + rp(p.price) + '</span></button>';
  }).join('') : '<div class="empty" style="grid-column:1/-1"><strong>Produk tidak ditemukan</strong>' + (S.products.length ? 'Coba kata kunci lain.' : (S.user.role === 'admin' ? 'Tambahkan produk lewat menu Produk.' : 'Belum ada produk. Hubungi Kasir Admin.')) + '</div>';
}

function scanEnter() {
  const q = S.q.trim(); if (!q) { return; }
  const ql = q.toLowerCase();
  let p = S.products.find(x => x.barcode && x.barcode === q) || S.products.find(x => x.sku && x.sku.toLowerCase() === ql);
  if (!p) {
    const m = S.products.filter(x => (x.name + ' ' + x.sku + ' ' + x.barcode).toLowerCase().includes(ql));
    if (m.length === 1) { p = m[0]; }
    else { toast(m.length ? 'Ada ' + m.length + ' produk cocok — pilih dari daftar.' : 'Produk "' + q + '" tidak ditemukan.', m.length ? '' : 'err'); return; }
  }
  addToCart(p); S.q = ''; $('#scan').value = ''; renderCatalog();
}

function addToCart(p) {
  if (p.track_stock && p.stock <= 0) { toast('Stok "' + p.name + '" habis.', 'err'); return; }
  const l = S.cart.find(x => x.product_id === p.id);
  if (l) { setQty(S.cart.indexOf(l), l.qty + 1, false); return; }
  S.cart.push({ product_id: p.id, name: p.name, price: p.price, qty: 1, unit: p.unit, tracked: p.track_stock, max: p.track_stock ? p.stock : 999999 });
  renderCart();
}
function setQty(i, q, fromInput) {
  const l = S.cart[i]; if (!l) { return; }
  if (q < 1) { S.cart.splice(i, 1); renderCart(); return; }
  if (q > l.max) { q = l.max; toast('Stok "' + l.name + '" hanya ' + int(l.max) + ' ' + l.unit + '.', 'err'); }
  l.qty = q; renderCart();
  if (fromInput) { const inp = $('.qin[data-i="' + i + '"]'); if (inp) { inp.focus(); inp.select(); } }
}

function renderCart() {
  const list = $('#cartList'); if (!list) { return; }
  const count = S.cart.reduce((a, l) => a + l.qty, 0);
  $('#cartCount').textContent = int(count);
  $('#paneCart').textContent = 'Keranjang' + (S.cart.length ? ' · ' + rp(calcCart().grand) : '');
  $('#clearBtn').hidden = !S.cart.length;
  const cu = custOf();
  const cb = $('#custBtn'); cb.className = 'cust-btn' + (cu ? ' on' : '');
  cb.innerHTML = '<span aria-hidden="true">👤</span><span>' + (cu ? esc(cu.name) : 'Pelanggan umum') + '</span>';
  list.innerHTML = S.cart.length ? S.cart.map((l, i) =>
    '<div class="cart-line"><div><div class="nm">' + esc(l.name) + '</div><div class="pr">' + rp(l.price) + ' / ' + esc(l.unit) + '</div></div><div class="sub">' + rp(l.price * l.qty) + '</div>' +
    '<div class="ctl"><div class="qty"><button type="button" data-act="dec" data-i="' + i + '" aria-label="Kurangi">−</button>' +
    '<input class="qin" data-i="' + i + '" type="text" inputmode="numeric" value="' + l.qty + '" aria-label="Jumlah ' + esc(l.name) + '">' +
    '<button type="button" data-act="inc" data-i="' + i + '" aria-label="Tambah">+</button></div>' +
    '<button type="button" class="rm" data-act="rm" data-i="' + i + '" aria-label="Hapus ' + esc(l.name) + '">Hapus</button></div></div>').join('')
    : '<div class="empty"><strong>Keranjang kosong</strong>Scan barcode atau pilih produk di sebelah.</div>';
  renderTotals();
}
function renderTotals() {
  const c = calcCart();

   DASHBOARD & REKAP PER USER

const PRESETS = [['today', 'Hari ini'], ['7', '7 hari'], ['30', '30 hari'], ['month', 'Bulan ini'], ['lastmonth', 'Bulan lalu'], ['custom', 'Kustom']];
function presetRange(p) {
  const t = ymdNow();
  if (p === 'today') { return [t, t]; }
  if (p === '7') { return [addD(t, -6), t]; }
  if (p === '30') { return [addD(t, -29), t]; }
  if (p === 'month') { return [t.slice(0, 8) + '01', t]; }
  if (p === 'lastmonth') { const end = addD(t.slice(0, 8) + '01', -1); return [end.slice(0, 8) + '01', end]; }
  return null;
}
S.dash = { preset: '7', from: presetRange('7')[0], to: presetRange('7')[1], type: 'all', q: '', data: null };
S.rek = { preset: 'month', from: presetRange('month')[0], to: presetRange('month')[1], data: null };

function rangeBar(scope) {
  const R = S[scope];
  return '<div class="range"><div class="chips" role="group" aria-label="Periode">' + PRESETS.map(p => '<button type="button" class="chip" aria-pressed="' + (R.preset === p[0]) + '" data-act="preset" data-scope="' + scope + '" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
    '<div class="actions"><label class="muted" for="' + scope + 'F">Dari</label><input type="date" id="' + scope + 'F" value="' + R.from + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '">' +
    '<label class="muted" for="' + scope + 'T">sampai</label><input type="date" id="' + scope + 'T" value="' + R.to + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '"></div></div>';
}
const periodTxt = r => r.from === r.to ? dmy(r.from) : dmy(r.from) + ' – ' + dmy(r.to);
const shortRp = v => v >= 1e9 ? (v / 1e9).toFixed(1).replace('.', ',') + ' M' : v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace('.', ',') + ' jt' : v >= 1e3 ? Math.round(v / 1e3) + ' rb' : String(Math.round(v));
function niceMax(v) { if (v <= 0) { return 1; } const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart(data, h) {
  h = h || 210; const vw = $('#view') ? $('#view').clientWidth : 720, W = Math.max(280, Math.min(760, vw - 60)), L = 50, B = 26, T = 10, R = 6, pw = W - L - R, ph = h - B - T;
  const max = niceMax(Math.max.apply(null, data.map(d => d.sales).concat([0])));
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + shortRp(max * i / 4) + '</text>'; }
  const n = data.length, slot = pw / n, bw = Math.min(46, Math.max(2, slot * .68)), step = Math.ceil(n / Math.max(3, Math.floor(pw / 58)));
  data.forEach((d, i) => {
    const bh = d.sales / max * ph, x = L + slot * i + (slot - bw) / 2;
    g += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + (T + ph - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, d.sales ? 1 : 0).toFixed(1) + '" rx="2"><title>' + dmy(d.date) + ': ' + rp(d.sales) + (d.tx !== undefined ? ' · ' + d.tx + ' transaksi' : '') + '</title></rect>';
    if (i % step === 0) { g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + dshort(d.date) + '</text>'; }
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="Grafik penjualan per hari">' + g + '</svg>';
}

const seg = (name, opts, cur) => '<div class="seg" role="group">' + opts.map(o => '<button type="button" data-seg="' + name + '" data-v="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>').join('') + '</div>';

const cbRow = (key, id, disabled) => '<td class="cbx"><input type="checkbox" data-act="selRow" data-k="' + key + '" data-id="' + id + '" aria-label="Pilih baris"' + (S.sel[key].has(id) ? ' checked' : '') + (disabled ? ' disabled title="Tidak dapat memilih akun Anda sendiri"' : '') + '></td>';
const LISTS = {
  products: { noun: 'produk', ids: () => prodFiltered().map(p => p.id), names: ids => S.prod.list.filter(p => ids.includes(p.id)).map(p => p.name), draw: () => drawProduk(), api: 'productDelete', drop(ids) { S.prod.list = S.prod.list.filter(p => !ids.includes(p.id)); markStale(); }, msg: 'Riwayat transaksi tetap tersimpan. Tindakan ini tidak dapat dibatalkan.' },
  customers: { noun: 'pelanggan', ids: () => custFiltered().map(c => c.id), names: ids => S.cust.list.filter(c => ids.includes(c.id)).map(c => c.name), draw: () => drawPelanggan(), api: 'customerDelete', drop(ids) { S.cust.list = S.cust.list.filter(c => !ids.includes(c.id)); markStale(); }, msg: 'Struk & invoice lama tetap menyimpan nama pelanggan. Tindakan ini tidak dapat dibatalkan.' },
  users: { noun: 'pengguna', ids: () => userFiltered().filter(u => u.id !== S.user.id).map(u => u.id), names: ids => S.usr.list.filter(u => ids.includes(u.id)).map(u => u.full_name + ' (@' + u.username + ')'), draw: () => drawPengguna(), api: 'userDelete', drop(ids) { S.usr.list = S.usr.list.filter(u => !ids.includes(u.id)); }, msg: 'Akun tidak bisa masuk lagi. Laporan penjualan lama tetap menampilkan namanya. Tindakan ini tidak dapat dibatalkan.' }
};
async function deleteSelected(key) {
  const L = LISTS[key], ids = Array.from(S.sel[key]); if (!ids.length) { return; }
  const ok = await confirmBox({ title: 'Hapus ' + ids.length + ' ' + L.noun + '?', message: L.msg, items: L.names(ids), ok: 'Hapus ' + ids.length + ' ' + L.noun, danger: true });
  if (!ok) { return; }
  await run(null, async () => {
    const r = await api(L.api, { ids });
    L.drop(ids); S.sel[key].clear(); L.draw(); toast(r.deleted + ' ' + L.noun + ' dihapus.', 'ok');
  });

/** Perkecil gambar QRIS (tanpa dipangkas agar tetap terbaca) hingga cukup kecil untuk disimpan di Sheet. */
function shrinkQris(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height)), out = '';
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', .9); if (out.length <= 300000) { return resolve(out); } scale *= .85;
      }
      reject(new Error('Gambar QRIS terlalu besar. Gunakan gambar yang lebih kecil.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}
